<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>大世界大富翁 · 地图编辑器 (最终版)</title>
    <script src="https://unpkg.com/konva@9/konva.min.js">
    </script>
    <style>
        /* ===== 样式与前一致，省略 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, sans-serif;
            background: #0f1117;
            color: #e8edf5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: #1a1d27;
            border-bottom: 1px solid #2a2d3a;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .toolbar h1 {
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-right: 8px;
        }
        .toolbar .btn {
            padding: 4px 12px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            background: #2a2d3a;
            color: #c8cdd8;
            transition: background 0.2s;
        }
        .toolbar .btn:hover {
            background: #3a3d4a;
            color: #fff;
        }
        .toolbar .btn-primary {
            background: #2563eb;
            color: #fff;
        }
        .toolbar .btn-primary:hover {
            background: #3b82f6;
        }
        .toolbar .btn-success {
            background: #16a34a;
            color: #fff;
        }
        .toolbar .btn-success:hover {
            background: #22c55e;
        }
        .toolbar .btn-warning {
            background: #d97706;
            color: #fff;
        }
        .toolbar .btn-warning:hover {
            background: #f59e0b;
        }
        .toolbar .btn-danger {
            background: #dc2626;
            color: #fff;
        }
        .toolbar .btn-danger:hover {
            background: #ef4444;
        }
        .toolbar .btn-outline {
            background: transparent;
            border: 1px solid #3a3d4a;
        }
        .toolbar .btn-outline:hover {
            background: #2a2d3a;
        }
        .toolbar .spacer {
            flex: 1;
        }
        .toolbar .status {
            font-size: 11px;
            color: #6b7280;
            background: #1a1d27;
            padding: 2px 10px;
            border-radius: 10px;
            border: 1px solid #2a2d3a;
        }
        .toolbar .mode-indicator {
            font-size: 11px;
            background: #1e3a5f;
            padding: 2px 12px;
            border-radius: 10px;
            color: #93c5fd;
        }
        .toolbar .zoom-indicator {
            font-size: 12px;
            background: #0f1117;
            padding: 2px 10px;
            border-radius: 10px;
            border: 1px solid #2a2d3a;
            color: #e8edf5;
            min-width: 44px;
            text-align: center;
        }
        #fileInput,
        #bgInput,
        #templateInput {
            display: none;
        }
        .dynamic-file-input {
            display: none;
        }
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .canvas-container {
            flex: 1;
            background: #0f1117;
            position: relative;
            overflow: hidden;
        }
        #editorCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }
        .panel {
            width: 340px;
            background: #141820;
            border-left: 1px solid #2a2d3a;
            padding: 16px;
            overflow-y: auto;
            flex-shrink: 0;
            font-size: 13px;
        }
        .panel h2 {
            font-size: 16px;
            margin-bottom: 12px;
        }
        .panel .empty {
            color: #6b7280;
            text-align: center;
            margin-top: 30px;
        }
        .panel .field {
            margin-bottom: 12px;
        }
        .panel .field label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #9ca3af;
            margin-bottom: 4px;
        }
        .panel .field input,
        .panel .field select,
        .panel .field textarea,
        .panel .custom-props input,
        .panel .custom-props select,
        .panel .custom-props textarea {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #2a2d3a;
            background: #0f1117;
            color: #e8edf5;
            font-size: 14px;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .panel .field input:focus,
        .panel .field select:focus,
        .panel .field textarea:focus,
        .panel .custom-props input:focus,
        .panel .custom-props select:focus,
        .panel .custom-props textarea:focus {
            border-color: #2563eb;
        }
        .panel .field input:disabled,
        .panel .field select:disabled,
        .panel .custom-props input:disabled,
        .panel .custom-props select:disabled {
            background: #1a1d27;
            color: #6b7280;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .panel .field textarea {
            resize: vertical;
            min-height: 50px;
        }
        .panel .field .hint {
            font-size: 11px;
            color: #4a4d5a;
            margin-top: 4px;
        }
        .panel .field-row {
            display: flex;
            gap: 10px;
        }
        .panel .field-row .field {
            flex: 1;
        }
        .panel .custom-props {
            border-top: 1px solid #2a2d3a;
            padding-top: 12px;
            margin-top: 10px;
        }
        .panel .custom-props .prop-group {
            margin-bottom: 10px;
            padding-left: 10px;
            border-left: 2px solid #2a2d3a;
        }
        .panel .custom-props .prop-group .prop-label {
            font-weight: 500;
            color: #9ca3af;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .panel .custom-props .prop-item {
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .panel .custom-props .prop-item label {
            font-size: 12px;
            color: #6b7280;
            min-width: 70px;
        }
        .panel .custom-props .prop-item input,
        .panel .custom-props .prop-item select {
            flex: 1;
            min-width: 100px;
        }
        .panel .custom-props .prop-array-item {
            display: flex;
            gap: 6px;
            margin-bottom: 4px;
        }
        .panel .custom-props .prop-array-item input {
            flex: 1;
        }
        .panel .custom-props .prop-array-item button {
            background: #2a2d3a;
            border: none;
            color: #c8cdd8;
            cursor: pointer;
            border-radius: 4px;
            padding: 0 8px;
            font-size: 14px;
        }
        .panel .custom-props .prop-array-item button:hover {
            background: #3a3d4a;
            color: #fff;
        }
        .panel .btn-delete {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            background: #7f1d1d;
            border: none;
            border-radius: 6px;
            color: #fca5a5;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
        }
        .panel .btn-delete:hover {
            background: #991b1b;
            color: #fff;
        }
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f1117;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2d3a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3a3d4a;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1d27;
            border: 1px solid #2a2d3a;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            color: #e8edf5;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- 工具栏 -->
    <div class="toolbar">
        <h1>🗺️ 地图编辑器</h1>
        <button class="btn btn-success" onclick="newMap()">📄 新建</button>
        <button class="btn btn-primary" onclick="exportJSON()">⬇️ 导出</button>
        <button class="btn" onclick="document.getElementById('fileInput').click()">📂 导入</button>
        <input type="file" id="fileInput" accept=".json" onchange="importJSON(event)" />
        <button class="btn btn-outline" onclick="undo()">↩️</button>
        <button class="btn btn-outline" onclick="redo()">↪️</button>
        <span class="spacer"></span>
        <span id="dynamicFileButtons"></span>
        <button class="btn btn-outline" onclick="document.getElementById('bgInput').click()">🖼️ 背景</button>
        <input type="file" id="bgInput" accept="image/*" onchange="loadBackground(event)" />
        <button class="btn btn-outline" onclick="removeBackground()">✖️</button>
        <button class="btn btn-outline" onclick="document.getElementById('templateInput').click()">📋 属性模板</button>
        <input type="file" id="templateInput" accept=".json" onchange="loadPropertyTemplate(event)" />
        <button class="btn btn-outline" id="gridToggle" onclick="toggleGrid()">▦ 网格</button>
        <button class="btn btn-outline" onclick="zoomOut()">−</button>
        <span class="zoom-indicator" id="zoomDisplay">100%</span>
        <button class="btn btn-outline" onclick="zoomIn()">+</button>
        <button class="btn btn-outline" onclick="resetZoom()">⟲</button>
        <button class="btn btn-warning" id="modeToggle" onclick="toggleMode()">🔗 连线</button>
        <span class="mode-indicator" id="modeStatus">编辑</span>
        <span class="status" id="statusBar">就绪</span>
        <span class="status" id="cellCount">0 格</span>
    </div>

    <div class="main">
        <div class="canvas-container" id="canvasContainer">
            <div id="editorCanvas"></div>
        </div>
        <div class="panel" id="propertyPanel">
            <h2>📐 属性</h2>
            <div class="empty">点击画布上的格子进行编辑</div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        // ================================================================
        //  1. 数据模型
        // ================================================================
        class Cell {
            constructor({ id, x = 0, y = 0, destinations = [], extra = {} }) {
                this.id = id;
                this.x = x;
                this.y = y;
                this.destinations = destinations || [];
                this.extra = extra || {};
            }
            toJSON() { return { ...this }; }
        }

        // ================================================================
        //  2. 全局状态
        // ================================================================
        let cells = [];
        let selectedId = null;
        let isLineMode = false;
        let lineStartId = null;
        let showGrid = true;

        let propertyTemplate = {};
        let filePropSources = {};

        const TYPE_COLORS = {
            property: '#22c55e',
            event: '#f59e0b',
            transport: '#3b82f6',
            monument: '#eab308',
            start: '#ef4444',
            jail: '#6b7280',
        };
        const TYPE_LABELS = {
            property: '地产',
            event: '事件',
            transport: '交通',
            monument: '纪念碑',
            start: '起点',
            jail: '监狱',
        };
        const STORAGE_KEY = 'map_editor_data_v17';
        const TEMPLATE_KEY = 'property_template_v9';
        const FILE_SOURCES_KEY = 'file_sources_v6';

        // ================================================================
        //  3. Undo / Redo
        // ================================================================
        let history = [];
        let historyIndex = -1;
        const MAX_HISTORY = 100;

        function saveState() {
            history = history.slice(0, historyIndex + 1);
            const snapshot = JSON.stringify(cells);
            history.push(snapshot);
            if (history.length > MAX_HISTORY) history.shift();
            historyIndex = history.length - 1;
        }

        function undo() {
            if (historyIndex <= 0) { setStatus('没有可撤销的操作'); return; }
            historyIndex--;
            restoreState(history[historyIndex]);
            setStatus(`撤销 (${historyIndex+1}/${history.length})`);
        }

        function redo() {
            if (historyIndex >= history.length - 1) { setStatus('没有可重做的操作'); return; }
            historyIndex++;
            restoreState(history[historyIndex]);
            setStatus(`重做 (${historyIndex+1}/${history.length})`);
        }

        function restoreState(json) {
            const data = JSON.parse(json);
            cells = data.map(c => new Cell(c));
            cells.forEach((c, i) => c.id = i);
            selectedId = null;
            lineStartId = null;
            renderMain();
            showPanel(null);
            autoSave();
        }

        function commitAction() { saveState();
            autoSave(); }

        // ================================================================
        //  4. Konva 初始化
        // ================================================================
        const container = document.getElementById('editorCanvas');
        const stage = new Konva.Stage({
            container: 'editorCanvas',
            width: container.clientWidth,
            height: container.clientHeight,
            draggable: false,
        });

        const bgLayer = new Konva.Layer();
        const gridLayer = new Konva.Layer();
        const mainLayer = new Konva.Layer();
        stage.add(bgLayer);
        stage.add(gridLayer);
        stage.add(mainLayer);

        let bgImage = null;
        let currentScale = 1;
        let offsetX = 0,
            offsetY = 0;
        const MIN_SCALE = 0.1,
            MAX_SCALE = 5.0,
            SCALE_STEP = 0.1;

        function updateTransform() {
            stage.scale({ x: currentScale, y: currentScale });
            stage.position({ x: offsetX, y: offsetY });
            bgLayer.draw();
            gridLayer.draw();
            mainLayer.draw();
            updateZoomDisplay();
        }

        function updateZoomDisplay() {
            document.getElementById('zoomDisplay').textContent = Math.round(currentScale * 100) + '%';
        }

        function setScale(newScale) {
            newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
            currentScale = newScale;
            updateTransform();
            drawGrid();
        }

        function zoomIn() { setScale(currentScale + SCALE_STEP); }

        function zoomOut() { setScale(currentScale - SCALE_STEP); }

        function resetZoom() { offsetX = 0;
            offsetY = 0;
            setScale(1); }

        stage.on('wheel', (e) => {
            e.evt.preventDefault();
            if (e.evt.ctrlKey || e.evt.metaKey) return;
            offsetX -= e.evt.deltaX || 0;
            offsetY -= e.evt.deltaY || 0;
            updateTransform();
        });

        document.addEventListener('keydown', (e) => {
            const isMod = e.ctrlKey || e.metaKey;
            if (isMod) {
                if (e.key === 'z' && !e.shiftKey) { e.preventDefault();
                    undo(); return; }
                if (e.key === 'Z' && e.shiftKey) { e.preventDefault();
                    redo(); return; }
                if (e.key === '=' || e.key === '+') { e.preventDefault();
                    zoomIn(); return; }
                if (e.key === '-') { e.preventDefault();
                    zoomOut(); return; }
                if (e.key === '0') { e.preventDefault();
                    resetZoom(); return; }
            }
            if (e.key === 'Backspace') {
                const active = document.activeElement;
                if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName ===
                        'SELECT')) return;
                if (selectedId !== null) { e.preventDefault();
                    deleteCell(selectedId); }
            }
        });

        window.addEventListener('resize', () => {
            stage.width(container.clientWidth);
            stage.height(container.clientHeight);
            updateTransform();
            drawGrid();
            renderMain();
        });

        // ================================================================
        //  5. 网格
        // ================================================================
        function drawGrid() {
            gridLayer.destroyChildren();
            if (!showGrid) return;
            const step = 50;
            const color = '#2a2d3a';
            const w = stage.width() / currentScale;
            const h = stage.height() / currentScale;
            const startX = -offsetX / currentScale;
            const startY = -offsetY / currentScale;
            const endX = startX + w;
            const endY = startY + h;
            const x0 = Math.floor(startX / step) * step;
            const y0 = Math.floor(startY / step) * step;
            for (let x = x0; x <= endX; x += step) {
                gridLayer.add(new Konva.Line({ points: [x, startY, x, endY], stroke: color, strokeWidth: 0.5,
                    listening: false }));
            }
            for (let y = y0; y <= endY; y += step) {
                gridLayer.add(new Konva.Line({ points: [startX, y, endX, y], stroke: color, strokeWidth: 0.5,
                    listening: false }));
            }
            gridLayer.draw();
        }

        function toggleGrid() {
            showGrid = !showGrid;
            document.getElementById('gridToggle').style.borderColor = showGrid ? '#fbbf24' : '#3a3d4a';
            drawGrid();
        }
        toggleGrid();

        // ================================================================
        //  6. 背景
        // ================================================================
        function loadBackground(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    if (bgImage) bgImage.destroy();
                    bgImage = new Konva.Image({ image: img, x: 0, y: 0, width: img.width, height: img.height,
                        listening: false });
                    bgLayer.add(bgImage);
                    bgLayer.draw();
                    setStatus('背景已导入');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function removeBackground() {
            if (bgImage) { bgImage.destroy();
                bgImage = null;
                bgLayer.draw();
                setStatus('背景已移除'); }
        }

        // ================================================================
        //  7. 属性模板加载（解析数组元素类型）
        // ================================================================
        function loadPropertyTemplate(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!Array.isArray(data) || data.length < 2) {
                        throw new Error('模板格式错误：应为包含两个对象的数组');
                    }
                    const typeDef = data[0];
                    const editDef = data[1];

                    const newTemplate = {};
                    const keys = Object.keys(typeDef);
                    for (const key of keys) {
                        if (['id', 'x', 'y', 'destinations'].includes(key)) continue;

                        const sample = typeDef[key];
                        let type = 'text';
                        let defaultValue = '';

                        if (Array.isArray(sample)) {
                            type = 'array';
                            // 判断数组元素类型
                            let elementType = 'text';
                            if (sample.length > 0) {
                                const first = sample[0];
                                if (typeof first === 'number') elementType = 'number';
                                else if (typeof first === 'boolean') elementType = 'boolean';
                                else elementType = 'text';
                            }
                            // 如果 sample 是 []，默认为文本
                            defaultValue = { type: elementType, value: [] };
                        } else if (typeof sample === 'boolean') {
                            type = 'boolean';
                            defaultValue = false;
                        } else if (typeof sample === 'number') {
                            type = 'number';
                            defaultValue = 0;
                        } else {
                            type = 'text';
                            defaultValue = '';
                        }

                        const editValue = editDef[key];
                        let editable = false;
                        let fileMode = false;
                        let options = null;

                        if (Array.isArray(editValue)) {
                            editable = true;
                            fileMode = false;
                            options = editValue;
                        } else if (typeof editValue === 'number') {
                            if (editValue === 2) {
                                editable = true;
                                fileMode = true;
                                options = null;
                            } else if (editValue === 1) {
                                editable = true;
                                fileMode = false;
                                options = null;
                            } else {
                                editable = false;
                                fileMode = false;
                                options = null;
                            }
                        } else {
                            editable = false;
                            fileMode = false;
                            options = null;
                        }

                        newTemplate[key] = {
                            type,
                            editable,
                            fileMode,
                            options,
                            default: defaultValue,
                        };
                    }

                    propertyTemplate = newTemplate;
                    localStorage.setItem(TEMPLATE_KEY, JSON.stringify(newTemplate));
                    setStatus(`属性模板已加载，${Object.keys(newTemplate).length} 个自定义属性`);
                    updateDynamicButtons();
                    if (selectedId !== null) showPanel(cells.find(c => c.id === selectedId));
                } catch (err) {
                    setStatus('❌ 模板加载失败: ' + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function loadTemplateFromStorage() {
            try {
                const raw = localStorage.getItem(TEMPLATE_KEY);
                if (raw) {
                    propertyTemplate = JSON.parse(raw);
                    return true;
                }
            } catch (e) {}
            return false;
        }

        // ================================================================
        //  8. 动态文件选择按钮
        // ================================================================
        function updateDynamicButtons() {
            const container = document.getElementById('dynamicFileButtons');
            container.innerHTML = '';
            const fileProps = Object.keys(propertyTemplate).filter(
                key => propertyTemplate[key].fileMode
            );
            if (fileProps.length === 0) return;

            for (const prop of fileProps) {
                if (!filePropSources[prop]) {
                    filePropSources[prop] = [];
                }
                const btn = document.createElement('button');
                btn.className = 'btn btn-outline';
                btn.textContent = `📂 ${prop}`;
                btn.title = `导入 ${prop} 文件夹`;
                const inputId = `fileInput_${prop}`;
                btn.onclick = () => document.getElementById(inputId).click();

                const input = document.createElement('input');
                input.type = 'file';
                input.id = inputId;
                input.className = 'dynamic-file-input';
                input.webkitdirectory = true;
                input.onchange = (e) => {
                    const files = e.target.files;
                    if (!files || !files.length) return;
                    const names = [];
                    for (let i = 0; i < files.length; i++) {
                        const path = files[i].webkitRelativePath;
                        const parts = path.split('/');
                        if (parts.length > 1) {
                            names.push(parts.slice(1).join('/'));
                        }
                    }
                    filePropSources[prop] = names;
                    try { localStorage.setItem(FILE_SOURCES_KEY, JSON.stringify(filePropSources)); } catch (e) {}
                    setStatus(`已导入 ${prop} 文件夹，${names.length} 个文件`);
                    if (selectedId !== null) showPanel(cells.find(c => c.id === selectedId));
                    e.target.value = '';
                };

                container.appendChild(btn);
                container.appendChild(input);
                container.appendChild(document.createTextNode(' '));
            }
        }

        function loadFileSourcesFromStorage() {
            try {
                const raw = localStorage.getItem(FILE_SOURCES_KEY);
                if (raw) {
                    filePropSources = JSON.parse(raw);
                    return true;
                }
            } catch (e) {}
            return false;
        }

        // ================================================================
        //  9. 主渲染
        // ================================================================
        function renderMain() {
            mainLayer.destroyChildren();

            cells.forEach(cell => {
                if (cell.destinations && Array.isArray(cell.destinations)) {
                    cell.destinations.forEach(targetId => {
                        const target = cells.find(c => c.id === targetId);
                        if (!target) return;
                        mainLayer.add(new Konva.Line({
                            points: [cell.x, cell.y, target.x, target.y],
                            stroke: '#4a6fa5',
                            strokeWidth: 2,
                            dash: [8, 4],
                            opacity: 0.6,
                            listening: false,
                        }));
                    });
                }
            });

            cells.forEach(cell => {
                const type = cell.extra.type || 'property';
                const name = cell.extra.name || '未命名';
                const color = TYPE_COLORS[type] || '#888';
                const isSelected = (selectedId === cell.id);
                const isLineStart = (lineStartId === cell.id);

                const rect = new Konva.Rect({
                    x: cell.x - 30,
                    y: cell.y - 30,
                    width: 60,
                    height: 60,
                    radius: 8,
                    fill: '#1a1d27',
                    stroke: isSelected ? '#fbbf24' : (isLineStart ? '#f59e0b' : '#2a2d3a'),
                    strokeWidth: isSelected ? 3 : 2,
                    shadowColor: 'rgba(0,0,0,0.4)',
                    shadowBlur: 8,
                    shadowOffsetY: 2,
                });
                mainLayer.add(rect);

                mainLayer.add(new Konva.Rect({
                    x: cell.x - 30,
                    y: cell.y - 20,
                    width: 6,
                    height: 40,
                    fill: color,
                    cornerRadius: [0, 2, 2, 0],
                    listening: false,
                }));

                mainLayer.add(new Konva.Text({
                    x: cell.x - 22,
                    y: cell.y - 26,
                    text: `#${cell.id}`,
                    fontSize: 9,
                    fill: '#4a4d5a',
                    listening: false,
                }));

                mainLayer.add(new Konva.Text({
                    x: cell.x - 24,
                    y: cell.y - 6,
                    text: name,
                    fontSize: 11,
                    fill: '#e8edf5',
                    width: 48,
                    align: 'center',
                    ellipsis: true,
                    listening: false,
                }));

                const behavior = cell.extra.behavior || '';
                const label = behavior ?
                    `${TYPE_LABELS[type]||type}·${behavior.split('/').pop()}` :
                    TYPE_LABELS[type] || type;
                mainLayer.add(new Konva.Text({
                    x: cell.x - 20,
                    y: cell.y + 16,
                    text: label,
                    fontSize: 7,
                    fill: behavior ? '#86efac' : '#6b7280',
                    width: 40,
                    align: 'center',
                    ellipsis: true,
                    listening: false,
                }));

                const icon = cell.extra.icon || '';
                if (icon) {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => {
                        const iconNode = new Konva.Image({
                            image: img,
                            x: cell.x - 16,
                            y: cell.y - 24,
                            width: 32,
                            height: 32,
                            listening: false,
                        });
                        mainLayer.add(iconNode);
                        mainLayer.draw();
                    };
                    img.src = icon;
                }

                if (isLineStart) {
                    mainLayer.add(new Konva.Circle({
                        x: cell.x,
                        y: cell.y,
                        radius: 34,
                        stroke: '#f59e0b',
                        strokeWidth: 2,
                        opacity: 0.5,
                        dash: [4, 4],
                        listening: false,
                    }));
                }

                const hitArea = new Konva.Rect({
                    x: cell.x - 30,
                    y: cell.y - 30,
                    width: 60,
                    height: 60,
                    fill: 'transparent',
                });

                hitArea.on('click', () => onCellClick(cell.id));
                hitArea.on('dblclick', () => onCellDblClick(cell.id));

                let dragData = null;
                hitArea.on('mousedown', (e) => {
                    if (isLineMode) return;
                    const pos = stage.getRelativePointerPosition();
                    if (!pos) return;
                    dragData = { offsetX: pos.x - cell.x, offsetY: pos.y - cell.y };
                    e.evt.stopPropagation();
                    e.cancelBubble = true;
                });

                window.addEventListener('mousemove', (e) => {
                    if (!dragData) return;
                    const pos = stage.getRelativePointerPosition();
                    if (!pos) return;
                    const newX = pos.x - dragData.offsetX;
                    const newY = pos.y - dragData.offsetY;
                    const maxX = stage.width() / currentScale - 30;
                    const maxY = stage.height() / currentScale - 30;
                    cell.x = Math.max(30, Math.min(maxX, newX));
                    cell.y = Math.max(30, Math.min(maxY, newY));
                    renderMain();
                });

                window.addEventListener('mouseup', (e) => {
                    if (dragData) {
                        dragData = null;
                        commitAction();
                    }
                });

                mainLayer.add(hitArea);
            });

            mainLayer.draw();
            document.getElementById('cellCount').textContent = cells.length + ' 格';
        }

        function render() { drawGrid();
            renderMain(); }

        // ================================================================
        //  10. 交互
        // ================================================================
        function onCellClick(id) {
            if (isLineMode) {
                if (lineStartId === null) {
                    lineStartId = id;
                    setStatus(`起点 #${id}，请点击目标`);
                    renderMain();
                    return;
                } else {
                    if (lineStartId === id) { lineStartId = null;
                        setStatus('取消连线');
                        renderMain(); return; }
                    const a = cells.find(c => c.id === lineStartId);
                    const b = cells.find(c => c.id === id);
                    if (!a || !b) { setStatus('错误');
                        lineStartId = null;
                        renderMain(); return; }
                    if (!a.destinations) a.destinations = [];
                    if (!b.destinations) b.destinations = [];
                    if (!a.destinations.includes(id)) a.destinations.push(id);
                    if (!b.destinations.includes(lineStartId)) b.destinations.push(lineStartId);
                    setStatus(`已连接 #${lineStartId} ↔ #${id}`);
                    lineStartId = null;
                    renderMain();
                    commitAction();
                    return;
                }
            }
            selectedId = id;
            renderMain();
            showPanel(cells.find(c => c.id === id));
        }

        function onCellDblClick(id) {
            selectedId = id;
            renderMain();
            showPanel(cells.find(c => c.id === id), true);
        }

        stage.on('click', (e) => {
            if (e.target !== stage) return;
            if (isLineMode) {
                if (lineStartId !== null) { lineStartId = null;
                    setStatus('取消连线');
                    renderMain(); }
                return;
            }
            const pos = stage.getRelativePointerPosition();
            if (!pos) return;
            const newId = cells.length > 0 ? Math.max(...cells.map(c => c.id)) + 1 : 0;

            const extra = {};
            for (const [key, def] of Object.entries(propertyTemplate)) {
                if (def.type === 'array') {
                    extra[key] = [];
                } else {
                    extra[key] = def.default;
                }
            }

            const newCell = new Cell({
                id: newId,
                x: pos.x,
                y: pos.y,
                extra: extra,
            });
            cells.push(newCell);
            selectedId = newId;
            renderMain();
            showPanel(newCell);
            setStatus(`创建格子 #${newId}`);
            commitAction();
        });

        // ================================================================
        //  11. 属性面板
        // ================================================================
        function showPanel(cell, focusName = false) {
            const panel = document.getElementById('propertyPanel');
            if (!cell) {
                panel.innerHTML = `<h2>📐 属性</h2><div class="empty">点击画布上的格子进行编辑</div>`;
                return;
            }

            let html = `<h2>📐 属性 · #${cell.id}</h2>`;
            html += `<div style="font-size:12px;color:#6b7280;margin-bottom:10px;">
                        位置: X ${Math.round(cell.x)}, Y ${Math.round(cell.y)}
                        <br/>连线: ${cell.destinations.length ? cell.destinations.join(', ') : '无'}
                    </div>`;

            if (Object.keys(propertyTemplate).length === 0) {
                html +=
                    `<div style="color:#6b7280;font-size:11px;">💡 未加载属性模板，请点击工具栏 “属性模板” 导入</div>`;
            } else {
                html += `<div class="custom-props">`;
                html += generatePropertyInputs(cell.extra, propertyTemplate);
                html += `</div>`;
            }

            html += `<button class="btn-delete" onclick="deleteCell(${cell.id})">🗑️ 删除此格</button>`;

            panel.innerHTML = html;
            bindExtraInputs(cell);

            if (focusName) {
                const nameInput = document.getElementById('extra_name');
                if (nameInput) { nameInput.focus();
                    nameInput.select(); }
            }
        }

        function generatePropertyInputs(extraData, template) {
            let html = '';
            for (const [key, def] of Object.entries(template)) {
                const currentValue = extraData[key] !== undefined ? extraData[key] : def.default;
                const isEditable = def.editable;
                const isFile = def.fileMode;

                if (def.type === 'array') {
                    let arr = Array.isArray(currentValue) ? currentValue : [];
                    html += `<div class="prop-group"><div class="prop-label">${key} (数组)</div><div id="extra_${key}-container">`;
                    arr.forEach((item, idx) => {
                        html += `<div class="prop-array-item">
                                    <input type="text" value="${item}" data-key="${key}" data-index="${idx}" class="array-item" placeholder="${key}..." ${!isEditable?'disabled':''} />
                                    ${isEditable ? `<button onclick="removeArrayItem('${key}', ${idx})">✖️</button>` : ''}
                                </div>`;
                    });
                    if (isEditable) {
                        html +=
                            `<button class="btn btn-outline" onclick="addArrayItem('${key}')" style="font-size:10px;padding:2px 8px;">+ 添加元素</button>`;
                    } else {
                        html += `<span class="readonly">(只读)</span>`;
                    }
                    html += `</div></div>`;
                    continue;
                }

                html += `<div class="prop-item">`;
                html += `<label>${key}</label>`;

                if (!isEditable) {
                    if (def.options && Array.isArray(def.options)) {
                        html += `<select id="extra_${key}" disabled>`;
                        for (const opt of def.options) {
                            const selected = (opt === currentValue) ? 'selected' : '';
                            html += `<option value="${opt}" ${selected}>${opt}</option>`;
                        }
                        html += `</select>`;
                    } else if (isFile) {
                        html += `<input type="text" id="extra_${key}" value="${currentValue||''}" disabled />`;
                    } else if (def.type === 'boolean') {
                        html += `<select id="extra_${key}" disabled>
                                    <option value="true" ${currentValue===true?'selected':''}>是</option>
                                    <option value="false" ${currentValue===false?'selected':''}>否</option>
                                </select>`;
                    } else if (def.type === 'number') {
                        html += `<input type="number" id="extra_${key}" value="${currentValue||0}" disabled />`;
                    } else {
                        html += `<input type="text" id="extra_${key}" value="${currentValue||''}" disabled />`;
                    }
                    html += `</div>`;
                    continue;
                }

                // 可编辑
                if (def.options && Array.isArray(def.options)) {
                    html += `<select id="extra_${key}">`;
                    for (const opt of def.options) {
                        const selected = (opt === currentValue) ? 'selected' : '';
                        html += `<option value="${opt}" ${selected}>${opt}</option>`;
                    }
                    html += `</select>`;
                } else if (isFile) {
                    const fileList = filePropSources[key] || [];
                    html += `<select id="extra_${key}">`;
                    if (fileList.length === 0) {
                        html += `<option value="">⚠️ 请导入 ${key} 文件夹</option>`;
                    } else {
                        html += `<option value="">— 选择 —</option>`;
                        for (const fname of fileList) {
                            const selected = (fname === currentValue) ? 'selected' : '';
                            html += `<option value="${fname}" ${selected}>${fname}</option>`;
                        }
                    }
                    html += `</select>`;
                } else if (def.type === 'boolean') {
                    html += `<select id="extra_${key}">
                                <option value="true" ${currentValue===true?'selected':''}>是</option>
                                <option value="false" ${currentValue===false?'selected':''}>否</option>
                            </select>`;
                } else if (def.type === 'number') {
                    html += `<input type="number" id="extra_${key}" value="${currentValue||0}" placeholder="${key}" />`;
                } else {
                    html += `<input type="text" id="extra_${key}" value="${currentValue||''}" placeholder="${key}" />`;
                }

                html += `</div>`;
            }
            return html;
        }

        // ================================================================
        //  12. 绑定事件（智能类型转换）
        // ================================================================
        function bindExtraInputs(cell) {
            for (const [key, def] of Object.entries(propertyTemplate)) {
                if (def.type === 'array') {
                    const container = document.getElementById(`extra_${key}-container`);
                    if (!container) continue;
                    container.querySelectorAll('.array-item').forEach(el => {
                        el.removeEventListener('input', handleArrayInput);
                        el.removeEventListener('keydown', handleArrayKeydown);
                        el.addEventListener('input', handleArrayInput);
                        el.addEventListener('keydown', handleArrayKeydown);
                    });
                    continue;
                }
                const input = document.getElementById(`extra_${key}`);
                if (!input) continue;
                const update = () => {
                    let val = input.value;
                    if (def.type === 'number') {
                        const num = parseFloat(val);
                        val = isNaN(num) ? 0 : num;
                    } else if (def.type === 'boolean') {
                        val = input.value === 'true';
                    }
                    cell.extra[key] = val;
                    commitAction();
                };
                input.removeEventListener('change', update);
                input.removeEventListener('input', update);
                input.addEventListener('change', update);
                input.addEventListener('input', update);
            }
        }

        // ---- 数组输入实时保存（智能类型转换） ----
        function handleArrayInput(e) {
            const input = e.target;
            const key = input.dataset.key;
            const idx = parseInt(input.dataset.index);
            const cell = cells.find(c => c.id === selectedId);
            if (!cell) return;
            if (!cell.extra[key]) cell.extra[key] = [];
            // 获取模板定义的元素类型
            let elementType = 'text';
            const def = propertyTemplate[key];
            if (def && def.default && typeof def.default === 'object' && def.default.type) {
                elementType = def.default.type;
            }
            let val = input.value;
            if (elementType === 'number') {
                const num = parseFloat(val);
                val = isNaN(num) ? 0 : num;
            } else if (elementType === 'boolean') {
                val = (val === 'true' || val === '1');
            }
            cell.extra[key][idx] = val;
        }

        // ---- 数组快捷键 ----
        function handleArrayKeydown(e) {
            if (e.altKey && e.key === 'Tab') {
                e.preventDefault();
                const input = e.target;
                const key = input.dataset.key;
                if (!key) return;
                const cell = cells.find(c => c.id === selectedId);
                if (!cell) return;
                commitAction();
                addArrayItem(key);
                setTimeout(() => {
                    const container = document.getElementById(`extra_${key}-container`);
                    if (!container) return;
                    const items = container.querySelectorAll('.array-item');
                    if (items.length > 0) {
                        items[items.length - 1].focus();
                    }
                }, 50);
            }
        }

        // ---- 数组操作 ----
        function addArrayItem(key) {
            const cell = cells.find(c => c.id === selectedId);
            if (!cell) return;
            if (!cell.extra[key]) cell.extra[key] = [];
            let defaultVal = '';
            const def = propertyTemplate[key];
            if (def && def.default && typeof def.default === 'object' && def.default.type) {
                const type = def.default.type;
                if (type === 'number') defaultVal = 0;
                else if (type === 'boolean') defaultVal = false;
                else defaultVal = '';
            }
            cell.extra[key].push(defaultVal);
            commitAction();
            showPanel(cell);
        }

        function removeArrayItem(key, idx) {
            const cell = cells.find(c => c.id === selectedId);
            if (!cell) return;
            if (!cell.extra[key]) return;
            cell.extra[key].splice(idx, 1);
            commitAction();
            showPanel(cell);
        }

        window.addArrayItem = addArrayItem;
        window.removeArrayItem = removeArrayItem;

        // ================================================================
        //  13. 删除格子
        // ================================================================
        function deleteCell(id) {
            const cell = cells.find(c => c.id === id);
            if (!cell) { setStatus('格子不存在'); return; }
            if (!confirm(`确定删除 #${id} 吗？`)) return;

            cells.forEach(c => {
                if (c.destinations) c.destinations = c.destinations.filter(d => d !== id);
            });
            cells = cells.filter(c => c.id !== id);
            cells.forEach((c, i) => c.id = i);
            selectedId = null;
            lineStartId = null;
            renderMain();
            showPanel(null);
            setStatus(`已删除 #${id}`);
            commitAction();
        }

        // ================================================================
        //  14. 模式切换
        // ================================================================
        function toggleMode() {
            isLineMode = !isLineMode;
            document.getElementById('modeToggle').textContent = isLineMode ? '✏️ 编辑' : '🔗 连线';
            document.getElementById('modeStatus').textContent = isLineMode ? '连线' : '编辑';
            lineStartId = null;
            setStatus(isLineMode ? '连线模式' : '编辑模式');
            renderMain();
        }

        // ================================================================
        //  15. 导出（补全所有属性，并转换数组元素类型）
        // ================================================================
        async function exportJSON() {
            if (cells.length === 0) { setStatus('地图为空'); return; }
            const exportData = cells.map(cell => {
                const obj = {
                    id: cell.id,
                    x: cell.x,
                    y: cell.y,
                    destinations: cell.destinations,
                };
                for (const [key, def] of Object.entries(propertyTemplate)) {
                    let value = cell.extra[key];
                    if (value === undefined) {
                        if (def.type === 'array') {
                            value = [];
                        } else {
                            value = def.default;
                        }
                    }
                    // 如果是数组，根据元素类型转换
                    if (def.type === 'array') {
                        let elementType = 'text';
                        if (def.default && typeof def.default === 'object' && def.default.type) {
                            elementType = def.default.type;
                        }
                        if (Array.isArray(value)) {
                            value = value.map(item => {
                                if (elementType === 'number') {
                                    const num = parseFloat(item);
                                    return isNaN(num) ? 0 : num;
                                } else if (elementType === 'boolean') {
                                    return item === true || item === 'true' || item === '1';
                                } else {
                                    return String(item);
                                }
                            });
                        }
                    }
                    obj[key] = value;
                }
                return obj;
            });
            const data = JSON.stringify(exportData, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            if ('showSaveFilePicker' in window) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: 'map.json',
                        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
                    });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    setStatus('导出成功 (已选择位置)');
                    return;
                } catch (err) { if (err.name !== 'AbortError') console.warn(err); }
            }
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'map.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            setStatus('导出成功');
        }

        // ================================================================
        //  16. 导入 / 新建
        // ================================================================
        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!Array.isArray(data)) throw new Error('无效数据');
                    cells = data.map(item => {
                        const extra = {};
                        const builtin = ['id', 'x', 'y', 'destinations'];
                        for (const key of Object.keys(item)) {
                            if (!builtin.includes(key)) {
                                extra[key] = item[key];
                            }
                        }
                        return new Cell({
                            id: item.id,
                            x: item.x,
                            y: item.y,
                            destinations: item.destinations || [],
                            extra: extra,
                        });
                    });
                    cells.forEach((c, i) => c.id = i);
                    selectedId = null;
                    lineStartId = null;
                    renderMain();
                    showPanel(null);
                    setStatus(`导入成功，${cells.length} 格`);
                    commitAction();
                } catch (err) {
                    setStatus('导入失败: ' + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function newMap() {
            if (cells.length > 0 && !confirm('确定新建？当前数据将丢失。')) return;
            cells = [];
            selectedId = null;
            lineStartId = null;
            isLineMode = false;
            document.getElementById('modeToggle').textContent = '🔗 连线';
            document.getElementById('modeStatus').textContent = '编辑';
            renderMain();
            showPanel(null);
            setStatus('已清空');
            commitAction();
        }

        // ================================================================
        //  17. 持久化
        // ================================================================
        function saveToLocal() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cells)); } catch (e) {}
        }

        function loadFromLocal() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    cells = data.map(c => new Cell(c));
                    cells.forEach(c => { if (c.x === undefined) c.x = 200 + Math.random() * 400;
                        if (c.y === undefined) c.y = 150 + Math.random() * 300; });
                    return true;
                }
            } catch (e) { console.warn('加载失败', e); }
            return false;
        }

        let autoSaveTimer = null;

        function autoSave() {
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(saveToLocal, 500);
        }

        // ================================================================
        //  18. UI辅助
        // ================================================================
        function setStatus(msg) {
            document.getElementById('statusBar').textContent = msg;
            showToast(msg);
        }
        let toastTimer = null;

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
        }

        // ================================================================
        //  19. 初始化
        // ================================================================
        function init() {
            loadTemplateFromStorage();
            loadFileSourcesFromStorage();
            const loaded = loadFromLocal();
            if (!loaded || cells.length === 0) {
                cells = [];
                setStatus('新地图');
            } else {
                setStatus(`已加载，${cells.length} 格`);
            }
            updateDynamicButtons();
            saveState();
            resetZoom();
            render();
            showPanel(null);
            // 暴露全局
            window.newMap = newMap;
            window.exportJSON = exportJSON;
            window.importJSON = importJSON;
            window.deleteCell = deleteCell;
            window.toggleMode = toggleMode;
            window.zoomIn = zoomIn;
            window.zoomOut = zoomOut;
            window.resetZoom = resetZoom;
            window.loadBackground = loadBackground;
            window.removeBackground = removeBackground;
            window.toggleGrid = toggleGrid;
            window.undo = undo;
            window.redo = redo;
            window.loadPropertyTemplate = loadPropertyTemplate;
            window.addArrayItem = addArrayItem;
            window.removeArrayItem = removeArrayItem;
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    </script>
</body>
</html>
