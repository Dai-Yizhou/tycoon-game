<svg xmlns="http://www.w3.org/2000/svg" width="60" height="66" viewBox="-30 -26 60 66">
  <!-- 玩家棋子：头 + 身体。填充与描边由应用样式表按类名驱动 -->
  <!-- 头取主题令牌（tycoon pieceHead/outline），身体取关系色 gp player color -->
