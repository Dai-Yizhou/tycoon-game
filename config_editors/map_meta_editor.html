<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Map-Meta 配置编辑器</title>
<!--
  使用说明：
  1. 本编辑器用于编辑 packages/server/map-meta.json 地图元数据配置。
  2. 界面分为五个分区：基本信息 / 时区配置 / 区域配置 / 数值字段定义 / 高级配置(config)。
  3. 基本信息：编辑 id、name、version、templateName、startCellId、dayNightCycleMinutes。
  4. 时区配置：增删时区，每项设置 id、offsetMinutes（分钟偏移）、cellIds（用英文逗号分隔的格子 id）。
  5. 区域配置：增删区域，每项设置 id、name、cellIds（逗号分隔）、prosperity、environmentValue、color（颜色选择器）。
  6. 数值字段定义：增删字段，每项设置 id、name、current、min、max（max 可留空）。
  7. 高级配置：config 为自由 JSON 对象，直接在文本框中编辑（合法 JSON 才能保存）。
  8. 工具栏支持导入 JSON、导出 JSON、复制 JSON 到剪贴板。
  9. 鼠标悬停字段标题可查看说明。
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e2e5ea;
    --border-strong: #cbd1d9;
    --text: #1f2430;
    --text-muted: #6b7280;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --danger: #dc2626;
    --success: #16a34a;
    --th-bg: #eef1f5;
    --row-hover: #f8fafc;
    --section-bg: #f0f3f7;
    --radius: 4px;
  }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .toolbar h1 {
    font-size: 14px;
    font-weight: 700;
    margin-right: 12px;
    white-space: nowrap;
  }
  .btn {
    padding: 4px 10px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    background: #fff;
    color: var(--text);
    transition: background .15s, border-color .15s;
    white-space: nowrap;
  }
  .btn:hover { background: #f1f3f7; }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-danger { background: #fff; color: var(--danger); border-color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .btn-success { background: var(--success); color: #fff; border-color: var(--success); }
  .btn-success:hover { background: #15803d; border-color: #15803d; }
  .spacer { flex: 1; }
  .status {
    font-size: 11px;
    color: var(--text-muted);
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--th-bg);
  }

  .content {
    flex: 1;
    overflow: auto;
    padding: 12px;
  }
  .section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
  }
  .section-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--section-bg);
    border-bottom: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) 0 0;
    font-weight: 700;
    font-size: 13px;
  }
  .section-head .sec-actions { margin-left: auto; display: flex; gap: 4px; }
  .section-body { padding: 10px 12px; }

  .grid2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
  }
  .grid3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px 16px;
  }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
  }
  input[type="text"], input[type="number"], select, textarea {
    width: 100%;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 3px;
    font-size: 12px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(37,99,235,.15);
  }
  textarea { resize: vertical; min-height: 60px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  input[type="color"] {
    width: 36px; height: 26px;
    padding: 1px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: #fff;
    cursor: pointer;
    vertical-align: middle;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  thead th {
    background: var(--th-bg);
    text-align: left;
    padding: 6px 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td {
    padding: 4px 6px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr:last-child td { border-bottom: none; }
  .btn-del { padding: 2px 8px; font-size: 11px; }
  .empty {
    text-align: center;
    padding: 16px;
    color: var(--text-muted);
    font-size: 12px;
  }
  .toast {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: #1f2430;
    color: #fff;
    padding: 6px 16px;
    border-radius: var(--radius);
    font-size: 12px;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
    z-index: 1000;
  }
  .toast.show { opacity: 1; }
  .color-cell { display: flex; align-items: center; gap: 6px; }
  .color-val { font-size: 11px; color: var(--text-muted); font-family: ui-monospace, monospace; }
</style>
</head>
<body>

<div class="toolbar">
  <h1>Map-Meta 配置编辑器</h1>
  <button class="btn" id="btnImport" title="从本地 JSON 文件导入 map-meta 配置，覆盖当前数据">导入JSON</button>
  <button class="btn" id="btnExport" title="将当前配置导出为 map-meta.json 文件">导出JSON</button>
  <button class="btn btn-success" id="btnCopy" title="将当前配置的 JSON 复制到剪贴板">复制JSON</button>
  <div class="spacer"></div>
  <span class="status" id="statusBar">就绪</span>
</div>

<div class="content">

  <!-- 基本信息 -->
  <div class="section">
    <div class="section-head">基本信息</div>
    <div class="section-body">
      <div class="grid3">
        <div class="field">
          <label title="地图唯一标识符">id</label>
          <input type="text" id="f-id" />
        </div>
        <div class="field">
          <label title="地图显示名称">name</label>
          <input type="text" id="f-name" />
        </div>
        <div class="field">
          <label title="版本号，语义化版本">version</label>
          <input type="text" id="f-version" />
        </div>
        <div class="field">
          <label title="地图模板名称，对应模板资源">templateName</label>
          <input type="text" id="f-templateName" />
        </div>
        <div class="field">
          <label title="玩家起始格子 id">startCellId</label>
          <input type="number" id="f-startCellId" />
        </div>
        <div class="field">
          <label title="昼夜循环周期（分钟）">dayNightCycleMinutes</label>
          <input type="number" id="f-dayNightCycleMinutes" />
        </div>
      </div>
    </div>
  </div>

  <!-- 时区配置 -->
  <div class="section">
    <div class="section-head">
      时区配置
      <div class="sec-actions">
        <button class="btn btn-primary" id="btnAddTz" title="新增一个时区">新增时区</button>
      </div>
    </div>
    <div class="section-body">
      <table>
        <thead>
          <tr>
            <th title="时区唯一标识符，如 UTC-8" style="width:160px">id</th>
            <th title="相对 UTC 的分钟偏移，负数为西区" style="width:120px">offsetMinutes</th>
            <th title="属于该时区的格子 id 列表，用英文逗号分隔">cellIds（逗号分隔）</th>
            <th style="width:60px;text-align:center">操作</th>
          </tr>
        </thead>
        <tbody id="tzBody"></tbody>
      </table>
    </div>
  </div>

  <!-- 区域配置 -->
  <div class="section">
    <div class="section-head">
      区域配置
      <div class="sec-actions">
        <button class="btn btn-primary" id="btnAddRegion" title="新增一个区域">新增区域</button>
      </div>
    </div>
    <div class="section-body">
      <table>
        <thead>
          <tr>
            <th title="区域唯一标识符" style="width:130px">id</th>
            <th title="区域显示名称" style="width:130px">name</th>
            <th title="属于该区域的格子 id 列表，逗号分隔">cellIds（逗号分隔）</th>
            <th title="繁荣度数值" style="width:80px">prosperity</th>
            <th title="环境值数值" style="width:90px">environmentValue</th>
            <th title="区域颜色标识" style="width:110px">color</th>
            <th style="width:60px;text-align:center">操作</th>
          </tr>
        </thead>
        <tbody id="regionBody"></tbody>
      </table>
    </div>
  </div>

  <!-- 数值字段定义 -->
  <div class="section">
    <div class="section-head">
      数值字段定义
      <div class="sec-actions">
        <button class="btn btn-primary" id="btnAddField" title="新增一个数值字段">新增字段</button>
      </div>
    </div>
    <div class="section-body">
      <table>
        <thead>
          <tr>
            <th title="字段唯一标识符，如 money" style="width:130px">id</th>
            <th title="字段显示名称" style="width:130px">name</th>
            <th title="初始当前值" style="width:90px">current</th>
            <th title="最小值" style="width:80px">min</th>
            <th title="最大值，可留空表示无上限" style="width:80px">max</th>
            <th style="width:60px;text-align:center">操作</th>
          </tr>
        </thead>
        <tbody id="fieldBody"></tbody>
      </table>
    </div>
  </div>

  <!-- 高级配置 -->
  <div class="section">
    <div class="section-head">高级配置（config 自由 JSON）</div>
    <div class="section-body">
      <div class="field">
        <label title="自由配置对象，需为合法 JSON。包含 era、startBonus、passBonus、taxRate 等">config 对象（编辑后失焦自动格式化校验）</label>
        <textarea id="f-config" rows="10" placeholder='{ "era": "古典时代" }'></textarea>
      </div>
    </div>
  </div>

</div>

<input type="file" id="fileInput" accept=".json" style="display:none" />
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  function $(id) { return document.getElementById(id); }
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 1600);
  }
  function setStatus(msg) { $("statusBar").textContent = msg; }
  function el(tag, attrs, html) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "class") e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    if (html != null) e.innerHTML = html;
    return e;
  }
  function makeText(value, ph) {
    var i = el("input", { type: "text", placeholder: ph || "" });
    i.value = value == null ? "" : value;
    return i;
  }
  function makeNumber(value) {
    var i = el("input", { type: "number", placeholder: "0" });
    i.value = value == null ? "" : value;
    return i;
  }
  function numOrNull(v) {
    if (v === "" || v == null) return null;
    var n = Number(v);
    return isNaN(n) ? null : n;
  }
  function parseCellIds(str) {
    if (!str) return [];
    return str.split(",").map(function (s) { return s.trim(); }).filter(function (s) { return s !== ""; })
      .map(function (s) { var n = Number(s); return isNaN(n) ? s : n; });
  }
  function cellIdsToStr(arr) {
    if (!Array.isArray(arr)) return "";
    return arr.join(", ");
  }
  function download(filename, text) {
    var blob = new Blob([text], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = el("a", { href: url, download: filename });
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function pretty(data) { return JSON.stringify(data, null, 2); }

  // ---------- data model ----------
  var data = {
    id: "", name: "", version: "", templateName: "",
    startCellId: 0, dayNightCycleMinutes: 15,
    timezones: [], regions: [], valueFieldDefinitions: [], config: {}
  };

  // ---------- basic info binding ----------
  var basicFields = ["id", "name", "version", "templateName", "startCellId", "dayNightCycleMinutes"];
  function bindBasic() {
    basicFields.forEach(function (key) {
      var input = $("f-" + key);
      input.value = data[key] == null ? "" : data[key];
      input.addEventListener("input", function () {
        if (key === "startCellId" || key === "dayNightCycleMinutes") {
          data[key] = numOrNull(input.value);
        } else {
          data[key] = input.value;
        }
      });
    });
  }

  // ---------- timezones ----------
  function renderTz() {
    var body = $("tzBody");
    body.innerHTML = "";
    if (data.timezones.length === 0) {
      body.appendChild(el("tr", {}, '<td colspan="4" class="empty">暂无时区，点击「新增时区」添加</td>'));
      return;
    }
    data.timezones.forEach(function (tz, idx) {
      var tr = el("tr");
      var tdId = el("td"); var idInput = makeText(tz.id, "tz-xxx");
      idInput.addEventListener("input", function () { tz.id = idInput.value; });
      tdId.appendChild(idInput); tr.appendChild(tdId);
      var tdOff = el("td"); var offInput = makeNumber(tz.offsetMinutes);
      offInput.addEventListener("input", function () { tz.offsetMinutes = numOrNull(offInput.value); });
      tdOff.appendChild(offInput); tr.appendChild(tdOff);
      var tdCells = el("td"); var cellsInput = makeText(cellIdsToStr(tz.cellIds), "0,1,2,3");
      cellsInput.title = "用英文逗号分隔格子 id";
      cellsInput.addEventListener("input", function () { tz.cellIds = parseCellIds(cellsInput.value); });
      tdCells.appendChild(cellsInput); tr.appendChild(tdCells);
      var tdAct = el("td", { style: "text-align:center" });
      var del = el("button", { class: "btn btn-danger btn-del" }, "删除");
      del.addEventListener("click", function () { data.timezones.splice(idx, 1); renderTz(); toast("已删除时区"); });
      tdAct.appendChild(del); tr.appendChild(tdAct);
      body.appendChild(tr);
    });
  }

  // ---------- regions ----------
  function renderRegions() {
    var body = $("regionBody");
    body.innerHTML = "";
    if (data.regions.length === 0) {
      body.appendChild(el("tr", {}, '<td colspan="7" class="empty">暂无区域，点击「新增区域」添加</td>'));
      return;
    }
    data.regions.forEach(function (r, idx) {
      var tr = el("tr");
      var tdId = el("td"); var idInput = makeText(r.id, "region-xxx");
      idInput.addEventListener("input", function () { r.id = idInput.value; });
      tdId.appendChild(idInput); tr.appendChild(tdId);
      var tdName = el("td"); var nameInput = makeText(r.name, "区域名称");
      nameInput.addEventListener("input", function () { r.name = nameInput.value; });
      tdName.appendChild(nameInput); tr.appendChild(tdName);
      var tdCells = el("td"); var cellsInput = makeText(cellIdsToStr(r.cellIds), "0,1,2");
      cellsInput.addEventListener("input", function () { r.cellIds = parseCellIds(cellsInput.value); });
      tdCells.appendChild(cellsInput); tr.appendChild(tdCells);
      var tdPros = el("td"); var prosInput = makeNumber(r.prosperity);
      prosInput.addEventListener("input", function () { r.prosperity = numOrNull(prosInput.value); });
      tdPros.appendChild(prosInput); tr.appendChild(tdPros);
      var tdEnv = el("td"); var envInput = makeNumber(r.environmentValue);
      envInput.addEventListener("input", function () { r.environmentValue = numOrNull(envInput.value); });
      tdEnv.appendChild(envInput); tr.appendChild(tdEnv);
      var tdColor = el("td");
      var wrap = el("div", { class: "color-cell" });
      var colorInput = el("input", { type: "color" });
      colorInput.value = r.color || "#4CAF50";
      var colorVal = el("span", { class: "color-val" }, colorInput.value);
      colorInput.addEventListener("input", function () { r.color = colorInput.value; colorVal.textContent = colorInput.value; });
      wrap.appendChild(colorInput); wrap.appendChild(colorVal);
      tdColor.appendChild(wrap); tr.appendChild(tdColor);
      var tdAct = el("td", { style: "text-align:center" });
      var del = el("button", { class: "btn btn-danger btn-del" }, "删除");
      del.addEventListener("click", function () { data.regions.splice(idx, 1); renderRegions(); toast("已删除区域"); });
      tdAct.appendChild(del); tr.appendChild(tdAct);
      body.appendChild(tr);
    });
  }

  // ---------- value fields ----------
  function renderFields() {
    var body = $("fieldBody");
    body.innerHTML = "";
    if (data.valueFieldDefinitions.length === 0) {
      body.appendChild(el("tr", {}, '<td colspan="6" class="empty">暂无字段，点击「新增字段」添加</td>'));
      return;
    }
    data.valueFieldDefinitions.forEach(function (f, idx) {
      var tr = el("tr");
      var tdId = el("td"); var idInput = makeText(f.id, "money");
      idInput.addEventListener("input", function () { f.id = idInput.value; });
      tdId.appendChild(idInput); tr.appendChild(tdId);
      var tdName = el("td"); var nameInput = makeText(f.name, "字段名称");
      nameInput.addEventListener("input", function () { f.name = nameInput.value; });
      tdName.appendChild(nameInput); tr.appendChild(tdName);
      var tdCur = el("td"); var curInput = makeNumber(f.current);
      curInput.addEventListener("input", function () { f.current = numOrNull(curInput.value); });
      tdCur.appendChild(curInput); tr.appendChild(tdCur);
      var tdMin = el("td"); var minInput = makeNumber(f.min);
      minInput.addEventListener("input", function () { f.min = numOrNull(minInput.value); });
      tdMin.appendChild(minInput); tr.appendChild(tdMin);
      var tdMax = el("td"); var maxInput = makeNumber(f.max);
      maxInput.addEventListener("input", function () {
        var v = numOrNull(maxInput.value);
        if (v == null) delete f.max; else f.max = v;
      });
      tdMax.appendChild(maxInput); tr.appendChild(tdMax);
      var tdAct = el("td", { style: "text-align:center" });
      var del = el("button", { class: "btn btn-danger btn-del" }, "删除");
      del.addEventListener("click", function () { data.valueFieldDefinitions.splice(idx, 1); renderFields(); toast("已删除字段"); });
      tdAct.appendChild(del); tr.appendChild(tdAct);
      body.appendChild(tr);
    });
  }

  // ---------- config textarea ----------
  function loadConfigText() {
    $("f-config").value = pretty(data.config || {});
  }
  function bindConfig() {
    var ta = $("f-config");
    ta.addEventListener("blur", function () {
      try {
        var parsed = JSON.parse(ta.value);
        data.config = parsed;
        ta.value = pretty(parsed);
        ta.style.borderColor = "";
        toast("config 已更新");
      } catch (e) {
        ta.style.borderColor = "var(--danger)";
        toast("config JSON 格式错误，未保存");
      }
    });
  }

  // ---------- load / collect ----------
  function loadAll(d) {
    data = {
      id: d.id || "", name: d.name || "", version: d.version || "",
      templateName: d.templateName || "", startCellId: d.startCellId || 0,
      dayNightCycleMinutes: d.dayNightCycleMinutes != null ? d.dayNightCycleMinutes : 15,
      timezones: Array.isArray(d.timezones) ? d.timezones : [],
      regions: Array.isArray(d.regions) ? d.regions : [],
      valueFieldDefinitions: Array.isArray(d.valueFieldDefinitions) ? d.valueFieldDefinitions : [],
      config: d.config && typeof d.config === "object" ? d.config : {}
    };
    basicFields.forEach(function (key) { $("f-" + key).value = data[key] == null ? "" : data[key]; });
    renderTz(); renderRegions(); renderFields(); loadConfigText();
  }

  // ---------- add buttons ----------
  $("btnAddTz").addEventListener("click", function () {
    data.timezones.push({ id: "tz_" + (data.timezones.length + 1), offsetMinutes: 0, cellIds: [] });
    renderTz(); toast("已新增时区");
  });
  $("btnAddRegion").addEventListener("click", function () {
    data.regions.push({ id: "region_" + (data.regions.length + 1), name: "新区域", cellIds: [], prosperity: 60, environmentValue: 50, color: "#4CAF50" });
    renderRegions(); toast("已新增区域");
  });
  $("btnAddField").addEventListener("click", function () {
    data.valueFieldDefinitions.push({ id: "field_" + (data.valueFieldDefinitions.length + 1), name: "新字段", current: 0, min: 0 });
    renderFields(); toast("已新增字段");
  });

  // ---------- import / export ----------
  $("btnImport").addEventListener("click", function () { $("fileInput").click(); });
  $("fileInput").addEventListener("change", function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      try {
        var parsed = JSON.parse(ev.target.result);
        loadAll(parsed);
        toast("已导入 map-meta 配置");
        setStatus("导入成功");
      } catch (err) {
        toast("导入失败: " + err.message);
        setStatus("导入失败");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });
  $("btnExport").addEventListener("click", function () {
    download("map-meta.json", pretty(data));
    toast("已导出 map-meta.json");
  });
  $("btnCopy").addEventListener("click", function () {
    var text = pretty(data);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast("JSON 已复制"); }, function () { fallbackCopy(text); });
    } else { fallbackCopy(text); }
  });
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("JSON 已复制"); } catch (e) { toast("复制失败"); }
    document.body.removeChild(ta);
  }

  // ---------- init ----------
  bindBasic();
  bindConfig();
  loadAll({
    id: "example-map", name: "示例地图", version: "1.0.0", templateName: "default",
    startCellId: 0, dayNightCycleMinutes: 15,
    timezones: [{ id: "tz-central", offsetMinutes: 0, cellIds: [0,1,2,3] }],
    regions: [{ id: "region-central", name: "中央区域", cellIds: [0,1,2], prosperity: 80, environmentValue: 50, color: "#4CAF50" }],
    valueFieldDefinitions: [{ id: "money", name: "财产", current: 2000, min: 0 }],
    config: { era: "古典时代", startBonus: 2000, passBonus: 200 }
  });
  setStatus("就绪");
})();
</script>
</body>
</html>
