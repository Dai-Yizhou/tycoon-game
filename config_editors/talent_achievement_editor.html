<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>天赋 / 成就配置编辑器</title>
<!--
  使用说明：
  1. 本编辑器用于编辑大富翁.io 的天赋(talents)与成就(achievements)配置。
  2. 顶部两个标签页可在「天赋编辑」与「成就编辑」之间切换。
  3. 表格支持行内编辑：直接修改输入框/下拉框即可；点击「删除」移除该行；点击「新增条目」添加一行。
  4. 天赋的 requires 字段为下拉选择，候选项来自当前所有天赋的 id；可选择「无」表示不依赖。
  5. 工具栏支持：
     - 导入：分别导入 talents.json / achievements.json 文件覆盖当前数据。
     - 导出：分别导出当前数据为 JSON 文件。
     - 复制：将当前标签页的 JSON 复制到剪贴板。
  6. 鼠标悬停字段标题可查看字段说明。
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e2e5ea;
    --border-strong: #cbd1d9;
    --text: #1f2430;
    --text-muted: #6b7280;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --success: #16a34a;
    --th-bg: #eef1f5;
    --row-hover: #f8fafc;
    --radius: 4px;
  }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .toolbar h1 {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-right: 12px;
    white-space: nowrap;
  }
  .btn {
    padding: 4px 10px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    background: #fff;
    color: var(--text);
    transition: background .15s, border-color .15s;
    white-space: nowrap;
  }
  .btn:hover { background: #f1f3f7; }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-danger { background: #fff; color: var(--danger); border-color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .btn-success { background: var(--success); color: #fff; border-color: var(--success); }
  .btn-success:hover { background: #15803d; border-color: #15803d; }
  .spacer { flex: 1; }
  .status {
    font-size: 11px;
    color: var(--text-muted);
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--th-bg);
  }

  .tabs {
    display: flex;
    gap: 2px;
    padding: 0 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .tab {
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

  .content {
    flex: 1;
    overflow: auto;
    padding: 10px 12px;
  }
  .panel { display: none; }
  .panel.active { display: block; }

  .panel-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .panel-head .count {
    font-size: 12px;
    color: var(--text-muted);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  thead th {
    background: var(--th-bg);
    text-align: left;
    padding: 6px 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td {
    padding: 4px 6px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr:last-child td { border-bottom: none; }

  input[type="text"], input[type="number"], select, textarea {
    width: 100%;
    padding: 3px 6px;
    border: 1px solid var(--border);
    border-radius: 3px;
    font-size: 12px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(37,99,235,.15);
  }
  textarea { resize: vertical; min-height: 28px; }
  .col-id { width: 130px; }
  .col-name { width: 140px; }
  .col-desc { min-width: 180px; }
  .col-rarity { width: 110px; }
  .col-cost { width: 70px; }
  .col-requires { width: 140px; }
  .col-branch { width: 120px; }
  .col-goal { width: 80px; }
  .col-reward { width: 80px; }
  .col-category { width: 120px; }
  .col-action { width: 70px; text-align: center; }
  .btn-del {
    padding: 2px 8px;
    font-size: 11px;
  }

  .empty {
    text-align: center;
    padding: 24px;
    color: var(--text-muted);
    font-size: 12px;
  }

  /* rarity color tags */
  .rarity-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
  }
  .toast {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: #1f2430;
    color: #fff;
    padding: 6px 16px;
    border-radius: var(--radius);
    font-size: 12px;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
    z-index: 1000;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="toolbar">
  <h1>天赋 / 成就配置编辑器</h1>
  <button class="btn" id="btnImportTalents" title="从本地 JSON 文件导入天赋数据，会覆盖当前天赋列表">导入天赋</button>
  <button class="btn" id="btnExportTalents" title="将当前天赋数据导出为 talents.json 文件">导出天赋</button>
  <button class="btn" id="btnImportAch" title="从本地 JSON 文件导入成就数据，会覆盖当前成就列表">导入成就</button>
  <button class="btn" id="btnExportAch" title="将当前成就数据导出为 achievements.json 文件">导出成就</button>
  <button class="btn btn-success" id="btnCopy" title="将当前标签页的数据复制到剪贴板">复制当前JSON</button>
  <div class="spacer"></div>
  <span class="status" id="statusBar">就绪</span>
</div>

<div class="tabs">
  <div class="tab active" data-tab="talents">天赋编辑</div>
  <div class="tab" data-tab="achievements">成就编辑</div>
</div>

<div class="content">
  <!-- 天赋面板 -->
  <div class="panel active" id="panel-talents">
    <div class="panel-head">
      <button class="btn btn-primary" id="btnAddTalent">新增天赋</button>
      <span class="count" id="talentCount">共 0 条</span>
    </div>
    <table>
      <thead>
        <tr>
          <th class="col-id" title="天赋唯一标识符，英文下划线，如 bank">id</th>
          <th class="col-name" title="天赋显示名称">name</th>
          <th class="col-desc" title="天赋效果描述">description</th>
          <th class="col-rarity" title="稀有度：common/uncommon/rare/epic/legendary">rarity</th>
          <th class="col-cost" title="学习该天赋需要消耗的天赋点">cost</th>
          <th class="col-requires" title="前置天赋 id，可选，从其他天赋中选择">requires</th>
          <th class="col-branch" title="天赋分支：economy/social/vision/utility/exploration">branch</th>
          <th class="col-action">操作</th>
        </tr>
      </thead>
      <tbody id="talentBody"></tbody>
    </table>
  </div>

  <!-- 成就面板 -->
  <div class="panel" id="panel-achievements">
    <div class="panel-head">
      <button class="btn btn-primary" id="btnAddAch">新增成就</button>
      <span class="count" id="achCount">共 0 条</span>
    </div>
    <table>
      <thead>
        <tr>
          <th class="col-id" title="成就唯一标识符，英文下划线">id</th>
          <th class="col-name" title="成就显示名称">name</th>
          <th class="col-desc" title="达成条件描述">description</th>
          <th class="col-rarity" title="稀有度：common/uncommon/rare/epic/legendary">rarity</th>
          <th class="col-goal" title="达成目标数值，如累计金额、次数等">goal</th>
          <th class="col-reward" title="达成后奖励的天赋点数">tpReward</th>
          <th class="col-category" title="成就分类：wealth/property/investment/monument/special/survival">category</th>
          <th class="col-action">操作</th>
        </tr>
      </thead>
      <tbody id="achBody"></tbody>
    </table>
  </div>
</div>

<input type="file" id="fileInput" accept=".json" style="display:none" />
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var RARITY_OPTIONS = ["common", "uncommon", "rare", "epic", "legendary"];
  var RARITY_COLORS = {
    common: "#9ca3af", uncommon: "#22c55e", rare: "#3b82f6",
    epic: "#a855f7", legendary: "#f59e0b"
  };
  var CATEGORY_OPTIONS = ["wealth", "property", "investment", "monument", "special", "survival"];
  var BRANCH_OPTIONS = ["economy", "social", "vision", "utility", "exploration"];

  var talents = [];
  var achievements = [];
  var activeTab = "talents";

  // ---------- helpers ----------
  function $(id) { return document.getElementById(id); }
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 1600);
  }
  function setStatus(msg) { $("statusBar").textContent = msg; }
  function el(tag, attrs, html) {
    var e = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (k === "class") e.className = attrs[k];
        else if (k === "title") e.setAttribute("title", attrs[k]);
        else e.setAttribute(k, attrs[k]);
      }
    }
    if (html != null) e.innerHTML = html;
    return e;
  }
  function makeText(value, ph) {
    var i = el("input", { type: "text", placeholder: ph || "" });
    i.value = value == null ? "" : value;
    return i;
  }
  function makeNumber(value) {
    var i = el("input", { type: "number", placeholder: "0" });
    i.value = value == null ? "" : value;
    return i;
  }
  function makeSelect(options, value) {
    var s = el("select");
    options.forEach(function (o) {
      var opt = el("option", { value: o }, o);
      s.appendChild(opt);
    });
    s.value = value || options[0];
    return s;
  }
  function download(filename, text) {
    var blob = new Blob([text], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = el("a", { href: url, download: filename });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function pretty(data) {
    return JSON.stringify(data, null, 2);
  }

  // ---------- render talents ----------
  function renderTalents() {
    var body = $("talentBody");
    body.innerHTML = "";
    $("talentCount").textContent = "共 " + talents.length + " 条";
    if (talents.length === 0) {
      body.appendChild(el("tr", {}, '<td colspan="8" class="empty">暂无数据，点击「新增天赋」添加</td>'));
      return;
    }
    talents.forEach(function (t, idx) {
      var tr = el("tr");
      // id
      var tdId = el("td");
      var idInput = makeText(t.id, "talent_id");
      idInput.addEventListener("input", function () { t.id = idInput.value; refreshRequiresOptions(); });
      tdId.appendChild(idInput);
      tr.appendChild(tdId);
      // name
      var tdName = el("td");
      var nameInput = makeText(t.name, "名称");
      nameInput.addEventListener("input", function () { t.name = nameInput.value; });
      tdName.appendChild(nameInput);
      tr.appendChild(tdName);
      // description
      var tdDesc = el("td");
      var descInput = makeText(t.description, "描述");
      descInput.addEventListener("input", function () { t.description = descInput.value; });
      tdDesc.appendChild(descInput);
      tr.appendChild(tdDesc);
      // rarity
      var tdRar = el("td");
      var rarSel = makeSelect(RARITY_OPTIONS, t.rarity);
      rarSel.addEventListener("change", function () { t.rarity = rarSel.value; });
      tdRar.appendChild(rarSel);
      tr.appendChild(tdRar);
      // cost
      var tdCost = el("td");
      var costInput = makeNumber(t.cost);
      costInput.addEventListener("input", function () { t.cost = numOrNull(costInput.value); });
      tdCost.appendChild(costInput);
      tr.appendChild(tdCost);
      // requires
      var tdReq = el("td");
      var reqSel = buildRequiresSelect(t.requires, t.id);
      tdReq.appendChild(reqSel);
      tr.appendChild(tdReq);
      // branch
      var tdBranch = el("td");
      var brSel = makeSelect(BRANCH_OPTIONS, t.branch);
      brSel.addEventListener("change", function () { t.branch = brSel.value; });
      tdBranch.appendChild(brSel);
      tr.appendChild(tdBranch);
      // action
      var tdAct = el("td", { class: "col-action" });
      var delBtn = el("button", { class: "btn btn-danger btn-del" }, "删除");
      delBtn.addEventListener("click", function () {
        talents.splice(idx, 1);
        renderTalents();
        toast("已删除");
      });
      tdAct.appendChild(delBtn);
      tr.appendChild(tdAct);
      body.appendChild(tr);
    });
  }

  function buildRequiresSelect(current, selfId) {
    var s = el("select");
    var noneOpt = el("option", { value: "" }, "无");
    s.appendChild(noneOpt);
    talents.forEach(function (t) {
      if (t.id === selfId) return;
      var opt = el("option", { value: t.id }, t.id);
      s.appendChild(opt);
    });
    s.value = current || "";
    s.addEventListener("change", function () {
      var v = s.value;
      // update the bound talent
      for (var i = 0; i < talents.length; i++) {
        if (talents[i].id === selfId) {
          if (v) talents[i].requires = v;
          else delete talents[i].requires;
          break;
        }
      }
    });
    return s;
  }

  function refreshRequiresOptions() {
    // rebuild requires selects to reflect id changes
    document.querySelectorAll("#talentBody tr").forEach(function (tr, idx) {
      var td = tr.children[5];
      if (!td) return;
      var old = td.querySelector("select");
      if (!old) return;
      var current = old.value;
      var selfId = talents[idx] ? talents[idx].id : "";
      var sel = buildRequiresSelect(current, selfId);
      td.replaceChild(sel, old);
    });
  }

  // ---------- render achievements ----------
  function renderAchievements() {
    var body = $("achBody");
    body.innerHTML = "";
    $("achCount").textContent = "共 " + achievements.length + " 条";
    if (achievements.length === 0) {
      body.appendChild(el("tr", {}, '<td colspan="8" class="empty">暂无数据，点击「新增成就」添加</td>'));
      return;
    }
    achievements.forEach(function (a, idx) {
      var tr = el("tr");
      var tdId = el("td"); var idInput = makeText(a.id, "ach_id");
      idInput.addEventListener("input", function () { a.id = idInput.value; });
      tdId.appendChild(idInput); tr.appendChild(tdId);
      var tdName = el("td"); var nameInput = makeText(a.name, "名称");
      nameInput.addEventListener("input", function () { a.name = nameInput.value; });
      tdName.appendChild(nameInput); tr.appendChild(tdName);
      var tdDesc = el("td"); var descInput = makeText(a.description, "描述");
      descInput.addEventListener("input", function () { a.description = descInput.value; });
      tdDesc.appendChild(descInput); tr.appendChild(tdDesc);
      var tdRar = el("td"); var rarSel = makeSelect(RARITY_OPTIONS, a.rarity);
      rarSel.addEventListener("change", function () { a.rarity = rarSel.value; });
      tdRar.appendChild(rarSel); tr.appendChild(tdRar);
      var tdGoal = el("td"); var goalInput = makeNumber(a.goal);
      goalInput.addEventListener("input", function () { a.goal = numOrNull(goalInput.value); });
      tdGoal.appendChild(goalInput); tr.appendChild(tdGoal);
      var tdRew = el("td"); var rewInput = makeNumber(a.tpReward);
      rewInput.addEventListener("input", function () { a.tpReward = numOrNull(rewInput.value); });
      tdRew.appendChild(rewInput); tr.appendChild(tdRew);
      var tdCat = el("td"); var catSel = makeSelect(CATEGORY_OPTIONS, a.category);
      catSel.addEventListener("change", function () { a.category = catSel.value; });
      tdCat.appendChild(catSel); tr.appendChild(tdCat);
      var tdAct = el("td", { class: "col-action" });
      var delBtn = el("button", { class: "btn btn-danger btn-del" }, "删除");
      delBtn.addEventListener("click", function () {
        achievements.splice(idx, 1);
        renderAchievements();
        toast("已删除");
      });
      tdAct.appendChild(delBtn); tr.appendChild(tdAct);
      body.appendChild(tr);
    });
  }

  function numOrNull(v) {
    if (v === "" || v == null) return null;
    var n = Number(v);
    return isNaN(n) ? null : n;
  }

  // ---------- tabs ----------
  document.querySelectorAll(".tab").forEach(function (tab) {
    tab.addEventListener("click", function () {
      document.querySelectorAll(".tab").forEach(function (t) { t.classList.remove("active"); });
      tab.classList.add("active");
      activeTab = tab.getAttribute("data-tab");
      document.querySelectorAll(".panel").forEach(function (p) { p.classList.remove("active"); });
      $("panel-" + activeTab).classList.add("active");
    });
  });

  // ---------- add ----------
  $("btnAddTalent").addEventListener("click", function () {
    talents.push({ id: "new_talent_" + (talents.length + 1), name: "新天赋", description: "", rarity: "common", cost: 1, branch: "economy" });
    renderTalents();
    toast("已新增天赋");
  });
  $("btnAddAch").addEventListener("click", function () {
    achievements.push({ id: "new_ach_" + (achievements.length + 1), name: "新成就", description: "", rarity: "common", goal: 1, tpReward: 1, category: "special" });
    renderAchievements();
    toast("已新增成就");
  });

  // ---------- import / export ----------
  var importTarget = null;
  $("btnImportTalents").addEventListener("click", function () { importTarget = "talents"; $("fileInput").click(); });
  $("btnImportAch").addEventListener("click", function () { importTarget = "achievements"; $("fileInput").click(); });

  $("fileInput").addEventListener("change", function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      try {
        var data = JSON.parse(ev.target.result);
        if (!Array.isArray(data)) throw new Error("JSON 必须为数组");
        if (importTarget === "talents") { talents = data; renderTalents(); toast("已导入 " + data.length + " 条天赋"); }
        else { achievements = data; renderAchievements(); toast("已导入 " + data.length + " 条成就"); }
        setStatus("导入成功");
      } catch (err) {
        toast("导入失败: " + err.message);
        setStatus("导入失败");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  $("btnExportTalents").addEventListener("click", function () {
    download("talents.json", pretty(talents));
    toast("已导出 talents.json");
  });
  $("btnExportAch").addEventListener("click", function () {
    download("achievements.json", pretty(achievements));
    toast("已导出 achievements.json");
  });

  $("btnCopy").addEventListener("click", function () {
    var data = activeTab === "talents" ? talents : achievements;
    var name = activeTab === "talents" ? "天赋" : "成就";
    var text = pretty(data);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(name + " JSON 已复制"); }, function () { fallbackCopy(text, name); });
    } else { fallbackCopy(text, name); }
  });
  function fallbackCopy(text, name) {
    var ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast(name + " JSON 已复制"); } catch (e) { toast("复制失败"); }
    document.body.removeChild(ta);
  }

  // ---------- init with sample data ----------
  talents = [
    { id: "credit", name: "信用系统", description: "启用信用值数值，影响贷款额度和事件概率", rarity: "common", cost: 1, branch: "economy" },
    { id: "bank", name: "银行系统", description: "启用银行贷款功能，可借款和还款", rarity: "uncommon", cost: 2, requires: "credit", branch: "economy" },
    { id: "team_boost", name: "组队加成", description: "组队时信用值加成翻倍", rarity: "common", cost: 1, branch: "social" }
  ];
  achievements = [
    { id: "first_move", name: "初次移动", description: "第一次掷骰移动", rarity: "common", goal: 1, tpReward: 1, category: "special" },
    { id: "money_1000", name: "小有积蓄", description: "累计赚取1000元", rarity: "common", goal: 1000, tpReward: 1, category: "wealth" }
  ];
  renderTalents();
  renderAchievements();
  setStatus("就绪");
})();
</script>
</body>
</html>
