<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Behavior 行为配置编辑器</title>
<!--
  使用说明：
  1. 本编辑器用于编辑 packages/server/config/behaviors/*.json 行为事件配置。
  2. 左侧列表显示所有 behavior 文件，点击可在右侧编辑。右侧编辑选中文件的 id、name、description 及事件列表。
  3. 新建：点击「新建文件」按钮，输入 id 后会自动生成文件名（如 event_xxx -> event_xxx.json）。
  4. 事件编辑：每条事件可设置 msg（提示文本）、money（金钱变化）、credit（信用变化）、env（环保变化）、
     item（道具：seal 查封令 / revive 复活令 / 无）、target（作用范围：player 仅自己 / region 区域内所有人）。
  5. 导入：可导入单个 behavior JSON 文件（会作为新文件加入列表）；也可批量导入多个 JSON 文件。
  6. 导出：导出当前选中文件为单个 JSON；「导出全部ZIP」将所有 behavior 打包为 ZIP 下载（需联网加载 JSZip）。
  7. 复制：将当前选中文件的 JSON 复制到剪贴板。
  8. 鼠标悬停字段标题可查看说明。
  注意：由于浏览器安全限制，编辑器无法直接读写服务器磁盘文件，请通过导入/导出与实际配置文件同步。
-->
<script src="https://unpkg.com/jszip@3/dist/jszip.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e2e5ea;
    --border-strong: #cbd1d9;
    --text: #1f2430;
    --text-muted: #6b7280;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --danger: #dc2626;
    --success: #16a34a;
    --th-bg: #eef1f5;
    --row-hover: #f8fafc;
    --list-active: #dbeafe;
    --radius: 4px;
  }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .toolbar h1 { font-size: 14px; font-weight: 700; margin-right: 12px; white-space: nowrap; }
  .btn {
    padding: 4px 10px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    background: #fff;
    color: var(--text);
    transition: background .15s, border-color .15s;
    white-space: nowrap;
  }
  .btn:hover { background: #f1f3f7; }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-danger { background: #fff; color: var(--danger); border-color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .btn-success { background: var(--success); color: #fff; border-color: var(--success); }
  .btn-success:hover { background: #15803d; border-color: #15803d; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .spacer { flex: 1; }
  .status {
    font-size: 11px; color: var(--text-muted);
    padding: 2px 8px; border-radius: 10px; background: var(--th-bg);
  }

  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .sidebar {
    width: 240px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-head {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .sidebar-head .title { font-weight: 700; font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .3px; }
  .new-row { display: flex; gap: 4px; }
  .new-row input { flex: 1; }
  .list {
    flex: 1;
    overflow: auto;
    padding: 4px;
  }
  .list-item {
    padding: 6px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 2px;
    border: 1px solid transparent;
  }
  .list-item:hover { background: var(--row-hover); }
  .list-item.active { background: var(--list-active); border-color: var(--primary); }
  .list-item .fname { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-item .ev-count { font-size: 10px; color: var(--text-muted); background: var(--th-bg); padding: 1px 5px; border-radius: 8px; flex-shrink: 0; }
  .list-item .del-x {
    font-size: 11px; color: var(--text-muted); cursor: pointer;
    width: 16px; height: 16px; line-height: 14px; text-align: center;
    border-radius: 50%; flex-shrink: 0;
  }
  .list-item .del-x:hover { background: var(--danger); color: #fff; }

  .editor {
    flex: 1;
    overflow: auto;
    padding: 12px;
  }
  .empty-editor {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: var(--text-muted); font-size: 13px;
  }
  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 11px; font-weight: 600; color: var(--text-muted); }
  input[type="text"], input[type="number"], select, textarea {
    width: 100%;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 3px;
    font-size: 12px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(37,99,235,.15);
  }
  textarea { resize: vertical; min-height: 32px; }

  .events-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .events-head h2 { font-size: 13px; font-weight: 700; }
  .events-head .count { font-size: 12px; color: var(--text-muted); }

  .event-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .event-card-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .event-card-head .idx {
    font-size: 11px; font-weight: 700; color: #fff;
    background: var(--primary); width: 18px; height: 18px;
    border-radius: 50%; text-align: center; line-height: 18px; flex-shrink: 0;
  }
  .event-card-head .spacer { flex: 1; }
  .ev-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 1fr 1fr;
    gap: 8px;
  }
  .ev-grid .field-msg { grid-column: 1 / -1; }
  .toast {
    position: fixed;
    bottom: 16px; left: 50%;
    transform: translateX(-50%);
    background: #1f2430; color: #fff;
    padding: 6px 16px; border-radius: var(--radius);
    font-size: 12px; opacity: 0;
    transition: opacity .25s;
    pointer-events: none; z-index: 1000;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="toolbar">
  <h1>Behavior 行为配置编辑器</h1>
  <button class="btn" id="btnImport" title="导入一个或多个 behavior JSON 文件，会作为新文件加入左侧列表">导入JSON文件</button>
  <button class="btn" id="btnExport" title="将当前选中的 behavior 导出为单个 JSON 文件">导出当前</button>
  <button class="btn btn-success" id="btnCopy" title="将当前选中文件的 JSON 复制到剪贴板">复制当前JSON</button>
  <button class="btn" id="btnZip" title="将所有 behavior 文件打包为 ZIP 下载（需联网加载 JSZip）">导出全部ZIP</button>
  <div class="spacer"></div>
  <span class="status" id="statusBar">就绪</span>
</div>

<div class="main">
  <!-- 左侧文件列表 -->
  <div class="sidebar">
    <div class="sidebar-head">
      <span class="title">文件列表 (<span id="fileCount">0</span>)</span>
      <div class="new-row">
        <input type="text" id="newId" placeholder="输入 id，如 event_xxx" title="新建文件的 id，会自动生成 event_xxx.json 文件名" />
        <button class="btn btn-primary" id="btnNew" title="根据输入的 id 新建 behavior 文件">新建</button>
      </div>
    </div>
    <div class="list" id="fileList"></div>
  </div>

  <!-- 右侧编辑区 -->
  <div class="editor" id="editorArea">
    <div class="empty-editor" id="emptyHint">← 请从左侧选择或新建一个 behavior 文件</div>
    <div id="editorContent" style="display:none">
      <div class="meta-grid">
        <div class="field">
          <label title="behavior 唯一标识符，通常与文件名对应">id</label>
          <input type="text" id="m-id" />
        </div>
        <div class="field">
          <label title="文件名（自动根据 id 生成，可手动修改）">文件名</label>
          <input type="text" id="m-filename" />
        </div>
        <div class="field">
          <label title="显示名称">name</label>
          <input type="text" id="m-name" />
        </div>
        <div class="field">
          <label title="描述说明">description</label>
          <input type="text" id="m-desc" />
        </div>
      </div>

      <div class="events-head">
        <h2>事件列表</h2>
        <span class="count" id="evCount">共 0 条</span>
        <div class="spacer"></div>
        <button class="btn btn-primary" id="btnAddEv" title="新增一条事件">新增事件</button>
      </div>
      <div id="eventList"></div>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept=".json" multiple style="display:none" />
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var ITEM_OPTIONS = ["", "seal", "revive"];
  var ITEM_LABELS = { "": "无", "seal": "seal 查封令", "revive": "revive 复活令" };
  var TARGET_OPTIONS = ["player", "region"];

  // data: array of { id, name, description, events:[], _filename }
  var files = [];
  var selectedIdx = -1;

  function $(id) { return document.getElementById(id); }
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 1600);
  }
  function setStatus(msg) { $("statusBar").textContent = msg; }
  function el(tag, attrs, html) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "class") e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    if (html != null) e.innerHTML = html;
    return e;
  }
  function makeText(value, ph) {
    var i = el("input", { type: "text", placeholder: ph || "" });
    i.value = value == null ? "" : value;
    return i;
  }
  function makeNumber(value) {
    var i = el("input", { type: "number", placeholder: "0" });
    i.value = value == null ? "" : value;
    return i;
  }
  function numOr(v, def) {
    if (v === "" || v == null) return def;
    var n = Number(v);
    return isNaN(n) ? def : n;
  }
  function pretty(data) { return JSON.stringify(data, null, 2); }
  function download(filename, text) {
    var blob = new Blob([text], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = el("a", { href: url, download: filename });
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function toExportObj(f) {
    return { id: f.id, name: f.name, description: f.description, events: f.events };
  }
  function filenameFromId(id) {
    return (id || "event_new") + ".json";
  }

  // ---------- render file list ----------
  function renderList() {
    var list = $("fileList");
    list.innerHTML = "";
    $("fileCount").textContent = files.length;
    if (files.length === 0) {
      list.appendChild(el("div", { style: "padding:12px;color:var(--text-muted);font-size:12px;text-align:center;" }, "暂无文件，请新建或导入"));
      return;
    }
    files.forEach(function (f, idx) {
      var item = el("div", { class: "list-item" + (idx === selectedIdx ? " active" : "") });
      var left = el("div", { style: "display:flex;flex-direction:column;overflow:hidden;flex:1" });
      left.appendChild(el("div", { class: "fname", title: f._filename }, f._filename));
      left.appendChild(el("div", { class: "ev-count", style: "align-self:flex-start;margin-top:2px;" }, f.events.length + " 条事件"));
      item.appendChild(left);
      var delX = el("span", { class: "del-x", title: "删除此文件" }, "×");
      delX.addEventListener("click", function (e) {
        e.stopPropagation();
        files.splice(idx, 1);
        if (selectedIdx === idx) selectedIdx = -1;
        else if (selectedIdx > idx) selectedIdx--;
        renderList();
        renderEditor();
        toast("已删除文件");
      });
      item.appendChild(delX);
      item.addEventListener("click", function () {
        selectedIdx = idx;
        renderList();
        renderEditor();
      });
      list.appendChild(item);
    });
  }

  // ---------- render editor ----------
  function renderEditor() {
    if (selectedIdx < 0 || !files[selectedIdx]) {
      $("emptyHint").style.display = "flex";
      $("editorContent").style.display = "none";
      return;
    }
    var f = files[selectedIdx];
    $("emptyHint").style.display = "none";
    $("editorContent").style.display = "block";

    var mId = $("m-id"); mId.value = f.id;
    mId.oninput = function () {
      f.id = mId.value;
      // auto-update filename if it followed the id pattern
      if (f._filename === filenameFromId(f._lastId || "") || !f._lastId) {
        f._filename = filenameFromId(f.id);
        f._lastId = f.id;
        $("m-filename").value = f._filename;
        renderList();
      }
      f._lastId = f.id;
    };
    var mFn = $("m-filename"); mFn.value = f._filename;
    mFn.oninput = function () { f._filename = mFn.value; renderList(); };
    var mName = $("m-name"); mName.value = f.name;
    mName.oninput = function () { f.name = mName.value; };
    var mDesc = $("m-desc"); mDesc.value = f.description;
    mDesc.oninput = function () { f.description = mDesc.value; };

    renderEvents();
  }

  function renderEvents() {
    var f = files[selectedIdx];
    var list = $("eventList");
    list.innerHTML = "";
    $("evCount").textContent = "共 " + f.events.length + " 条";
    if (f.events.length === 0) {
      list.appendChild(el("div", { style: "text-align:center;padding:16px;color:var(--text-muted);font-size:12px;" }, "暂无事件，点击「新增事件」添加"));
      return;
    }
    f.events.forEach(function (ev, idx) {
      var card = el("div", { class: "event-card" });
      var head = el("div", { class: "event-card-head" });
      head.appendChild(el("div", { class: "idx" }, String(idx + 1)));
      head.appendChild(el("span", { style: "font-size:12px;font-weight:600;" }, "事件 " + (idx + 1)));
      var sp = el("div", { class: "spacer" }); head.appendChild(sp);
      var upBtn = el("button", { class: "btn", title: "上移该事件" }, "上移");
      upBtn.style.padding = "2px 8px"; upBtn.style.fontSize = "11px";
      upBtn.disabled = (idx === 0);
      upBtn.addEventListener("click", function () {
        if (idx > 0) { var tmp = f.events[idx-1]; f.events[idx-1] = f.events[idx]; f.events[idx] = tmp; renderEvents(); }
      });
      head.appendChild(upBtn);
      var downBtn = el("button", { class: "btn", title: "下移该事件" }, "下移");
      downBtn.style.padding = "2px 8px"; downBtn.style.fontSize = "11px";
      downBtn.disabled = (idx === f.events.length - 1);
      downBtn.addEventListener("click", function () {
        if (idx < f.events.length - 1) { var tmp = f.events[idx+1]; f.events[idx+1] = f.events[idx]; f.events[idx] = tmp; renderEvents(); }
      });
      head.appendChild(downBtn);
      var delBtn = el("button", { class: "btn btn-danger", title: "删除该事件" }, "删除");
      delBtn.style.padding = "2px 8px"; delBtn.style.fontSize = "11px";
      delBtn.addEventListener("click", function () { f.events.splice(idx, 1); renderEvents(); toast("已删除事件"); });
      head.appendChild(delBtn);
      card.appendChild(head);

      var grid = el("div", { class: "ev-grid" });
      // msg
      var fMsg = el("div", { class: "field field-msg" });
      fMsg.appendChild(el("label", { title: "事件触发时显示的提示文本" }, "msg 提示文本"));
      var msgTa = el("textarea", { placeholder: "🎉 逛街捡到红包！获得 200 元", rows: "2" });
      msgTa.value = ev.msg || "";
      msgTa.oninput = function () { ev.msg = msgTa.value; };
      fMsg.appendChild(msgTa);
      grid.appendChild(fMsg);
      // money
      grid.appendChild(makeEvField("money 金钱", "金钱变化（正获得负损失）", ev.money, function (v) { setNum(ev, "money", v); }));
      // credit
      grid.appendChild(makeEvField("credit 信用", "信用值变化", ev.credit, function (v) { setNum(ev, "credit", v); }));
      // env
      grid.appendChild(makeEvField("env 环保", "环保值变化", ev.env, function (v) { setNum(ev, "env", v); }));
      // item
      var fItem = el("div", { class: "field" });
      fItem.appendChild(el("label", { title: "道具奖励：seal 查封令 / revive 复活令 / 无" }, "item 道具"));
      var itemSel = el("select");
      ITEM_OPTIONS.forEach(function (o) {
        itemSel.appendChild(el("option", { value: o }, ITEM_LABELS[o]));
      });
      itemSel.value = ev.item || "";
      itemSel.onchange = function () {
        if (itemSel.value) ev.item = itemSel.value; else delete ev.item;
      };
      fItem.appendChild(itemSel);
      grid.appendChild(fItem);
      // target
      var fTarget = el("div", { class: "field" });
      fTarget.appendChild(el("label", { title: "作用范围：player 仅自己 / region 区域内所有人。无则默认 player" }, "target 范围"));
      var tgtSel = el("select");
      var noneOpt = el("option", { value: "" }, "默认(player)");
      tgtSel.appendChild(noneOpt);
      TARGET_OPTIONS.forEach(function (o) { tgtSel.appendChild(el("option", { value: o }, o)); });
      tgtSel.value = ev.target || "";
      tgtSel.onchange = function () {
        if (tgtSel.value) ev.target = tgtSel.value; else delete ev.target;
      };
      fTarget.appendChild(tgtSel);
      grid.appendChild(fTarget);

      card.appendChild(grid);
      list.appendChild(card);
    });
  }

  function makeEvField(label, title, value, onInput) {
    var f = el("div", { class: "field" });
    f.appendChild(el("label", { title: title }, label));
    var inp = makeNumber(value);
    inp.oninput = function () { onInput(inp.value); };
    f.appendChild(inp);
    return f;
  }
  function setNum(ev, key, v) {
    if (v === "" || v == null) { ev[key] = 0; return; }
    var n = Number(v);
    ev[key] = isNaN(n) ? 0 : n;
  }

  // ---------- new file ----------
  $("btnNew").addEventListener("click", function () {
    var id = $("newId").value.trim();
    if (!id) { toast("请先输入 id"); return; }
    var fn = filenameFromId(id);
    // avoid duplicate filename
    if (files.some(function (f) { return f._filename === fn; })) { toast("已存在同名文件: " + fn); return; }
    var f = { id: id, name: id, description: "", events: [], _filename: fn, _lastId: id };
    files.push(f);
    selectedIdx = files.length - 1;
    $("newId").value = "";
    renderList();
    renderEditor();
    toast("已新建文件: " + fn);
  });
  $("newId").addEventListener("keydown", function (e) { if (e.key === "Enter") $("btnNew").click(); });

  // ---------- add event ----------
  $("btnAddEv").addEventListener("click", function () {
    if (selectedIdx < 0) return;
    files[selectedIdx].events.push({ msg: "新事件", money: 0, credit: 0, env: 0 });
    renderEvents();
    renderList();
    toast("已新增事件");
  });

  // ---------- import ----------
  $("btnImport").addEventListener("click", function () { $("fileInput").click(); });
  $("fileInput").addEventListener("change", function (e) {
    var fileList = e.target.files;
    if (!fileList || fileList.length === 0) return;
    var pending = fileList.length;
    var added = 0;
    Array.prototype.forEach.call(fileList, function (file) {
      var reader = new FileReader();
      reader.onload = function (ev) {
        try {
          var parsed = JSON.parse(ev.target.result);
          if (!parsed || typeof parsed !== "object") throw new Error("非对象");
          var fn = file.name;
          if (files.some(function (f) { return f._filename === fn; })) {
            // overwrite existing
            var oi = files.findIndex(function (f) { return f._filename === fn; });
            files[oi] = { id: parsed.id || fn.replace(/\.json$/, ""), name: parsed.name || "", description: parsed.description || "", events: Array.isArray(parsed.events) ? parsed.events : [], _filename: fn, _lastId: parsed.id };
          } else {
            files.push({ id: parsed.id || fn.replace(/\.json$/, ""), name: parsed.name || "", description: parsed.description || "", events: Array.isArray(parsed.events) ? parsed.events : [], _filename: fn, _lastId: parsed.id });
            added++;
          }
        } catch (err) {
          toast("导入失败: " + file.name);
        }
        pending--;
        if (pending === 0) {
          renderList();
          renderEditor();
          toast("已导入文件");
          setStatus("导入完成");
        }
      };
      reader.readAsText(file);
    });
    e.target.value = "";
  });

  // ---------- export current ----------
  $("btnExport").addEventListener("click", function () {
    if (selectedIdx < 0) { toast("请先选择一个文件"); return; }
    var f = files[selectedIdx];
    download(f._filename || (f.id + ".json"), pretty(toExportObj(f)));
    toast("已导出 " + f._filename);
  });

  // ---------- copy ----------
  $("btnCopy").addEventListener("click", function () {
    if (selectedIdx < 0) { toast("请先选择一个文件"); return; }
    var text = pretty(toExportObj(files[selectedIdx]));
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast("JSON 已复制"); }, function () { fallbackCopy(text); });
    } else { fallbackCopy(text); }
  });
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("JSON 已复制"); } catch (e) { toast("复制失败"); }
    document.body.removeChild(ta);
  }

  // ---------- export all zip ----------
  $("btnZip").addEventListener("click", function () {
    if (files.length === 0) { toast("没有可导出的文件"); return; }
    if (typeof JSZip === "undefined") {
      toast("JSZip 未加载（可能离线），改为逐个导出");
      files.forEach(function (f) { download(f._filename, pretty(toExportObj(f))); });
      return;
    }
    var zip = new JSZip();
    var folder = zip.folder("behaviors");
    files.forEach(function (f) {
      folder.file(f._filename, pretty(toExportObj(f)));
    });
    zip.generateAsync({ type: "blob" }).then(function (blob) {
      var url = URL.createObjectURL(blob);
      var a = el("a", { href: url, download: "behaviors.zip" });
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast("已导出 behaviors.zip");
    }, function () { toast("ZIP 生成失败"); });
  });

  // ---------- init sample data ----------
  files = [
    {
      id: "event_city_center", name: "市中心事件", description: "繁华市中心的随机事件",
      events: [
        { msg: "🎉 逛街捡到红包！获得 200 元", money: 200, credit: 0, env: 0 },
        { msg: "💸 停车罚款，损失 80 元", money: -80, credit: 0, env: 0 },
        { msg: "⭐ 帮助迷路老人，信用值+8", money: 0, credit: 8, env: 0 },
        { msg: "🔑 获得查封令道具", money: 0, credit: 0, env: 0, item: "seal" },
        { msg: "🎊 城市庆典，区域内所有人获得 100 元", money: 100, credit: 0, env: 0, target: "region" }
      ],
      _filename: "event_city_center.json", _lastId: "event_city_center"
    },
    {
      id: "event_residential", name: "住宅区事件", description: "宁静住宅区的随机事件",
      events: [
        { msg: "🎉 邻居送礼，获得 100 元", money: 100, credit: 2, env: 0 },
        { msg: "💸 水管爆裂，维修花费 60 元", money: -60, credit: 0, env: 0 },
        { msg: "🌱 社区花园义务劳动，环保值+5", money: 0, credit: 2, env: 5 }
      ],
      _filename: "event_residential.json", _lastId: "event_residential"
    }
  ];
  selectedIdx = 0;
  renderList();
  renderEditor();
  setStatus("就绪");
})();
</script>
</body>
</html>
