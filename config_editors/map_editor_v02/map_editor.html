<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>地图编辑器 v02 · 新格式</title>
    <script src="https://unpkg.com/konva@9/konva.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: #0f1117;
            color: #e8edf5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: #1a1d27;
            border-bottom: 1px solid #2a2d3a;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .toolbar h1 { font-size: 15px; font-weight: 600; color: #fbbf24; margin-right: 8px; }
        .toolbar .btn {
            padding: 4px 12px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            background: #2a2d3a;
            color: #c8cdd8;
            transition: background 0.2s;
        }
        .toolbar .btn:hover { background: #3a3d4a; color: #fff; }
        .toolbar .btn-primary { background: #2563eb; color: #fff; }
        .toolbar .btn-primary:hover { background: #3b82f6; }
        .toolbar .btn-success { background: #16a34a; color: #fff; }
        .toolbar .btn-success:hover { background: #22c55e; }
        .toolbar .btn-warning { background: #d97706; color: #fff; }
        .toolbar .btn-warning:hover { background: #f59e0b; }
        .toolbar .btn-danger { background: #dc2626; color: #fff; }
        .toolbar .btn-danger:hover { background: #ef4444; }
        .toolbar .btn-outline { background: transparent; border: 1px solid #3a3d4a; }
        .toolbar .btn-outline:hover { background: #2a2d3a; }
        .toolbar .spacer { flex: 1; }
        .toolbar .status {
            font-size: 11px; color: #6b7280; background: #1a1d27;
            padding: 2px 10px; border-radius: 10px; border: 1px solid #2a2d3a;
        }
        .toolbar .mode-indicator {
            font-size: 11px; background: #1e3a5f; padding: 2px 12px;
            border-radius: 10px; color: #93c5fd;
        }
        .toolbar .zoom-indicator {
            font-size: 12px; background: #0f1117; padding: 2px 10px;
            border-radius: 10px; border: 1px solid #2a2d3a; color: #e8edf5;
            min-width: 44px; text-align: center;
        }
        #fileInput, #bgInput, #metaInput, #behaviorInput { display: none; }
        .main { display: flex; flex: 1; overflow: hidden; }
        .canvas-container { flex: 1; background: #0f1117; position: relative; overflow: hidden; }
        #editorCanvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
        .panel {
            width: 420px;
            background: #141820;
            border-left: 1px solid #2a2d3a;
            padding: 16px;
            overflow-y: auto;
            flex-shrink: 0;
            font-size: 13px;
        }
        .panel h2 { font-size: 16px; margin-bottom: 12px; }
        .panel .empty { color: #6b7280; text-align: center; margin-top: 30px; line-height: 1.8; }
        .panel .cell-brief {
            font-size: 12px; color: #6b7280; margin-bottom: 14px;
            line-height: 1.6; background: #0f1117; border: 1px solid #232634;
            border-radius: 6px; padding: 8px 10px;
        }
        .panel .section { margin-bottom: 12px; }
        .panel .section > label {
            display: block; font-size: 12px; font-weight: 500; color: #9ca3af; margin-bottom: 4px;
        }
        .panel .section-row { display: flex; gap: 10px; }
        .panel .section-row .section { flex: 1; }
        .panel .hint { font-size: 11px; color: #4a4d5a; font-weight: 400; margin-left: 4px; }
        .panel .field input, .panel .field select, .panel .field textarea,
        .panel .section input, .panel .section select, .panel .section textarea {
            width: 100%;
            padding: 7px 10px;
            border-radius: 6px;
            border: 1px solid #2a2d3a;
            background: #0f1117;
            color: #e8edf5;
            font-size: 13px;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .panel .section input:focus, .panel .section select:focus, .panel .section textarea:focus {
            border-color: #2563eb;
        }
        .panel .section textarea { resize: vertical; min-height: 44px; }
        .panel .type-select { font-weight: 600; color: #fbbf24; }
        .panel .type-hint { font-size: 11px; color: #4a4d5a; margin-top: 4px; line-height: 1.5; }
        .panel .toggle {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 12px; color: #9ca3af; cursor: pointer; margin-right: 10px; white-space: nowrap;
        }
        .panel .bim { display: flex; align-items: center; gap: 8px; }
        /* UCT 编辑器 */
        .uct-editor { background: #0f1117; border: 1px solid #232634; border-radius: 6px; padding: 8px; }
        .uct-group { margin-bottom: 6px; }
        .uct-group:last-child { margin-bottom: 0; }
        .uct-group-title { font-size: 11px; color: #93c5fd; margin-bottom: 4px; font-weight: 600; }
        .uct-empty { font-size: 11px; color: #4a4d5a; }
        .uct-field { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .uct-field label { font-size: 12px; color: #9ca3af; min-width: 64px; }
        .uct-field input { flex: 1; min-width: 0; }
        /* 数组编辑器 */
        .array-editor { border-left: 2px solid #2a2d3a; padding-left: 8px; }
        .array-row { background: #0f1117; border: 1px solid #232634; border-radius: 6px; padding: 8px; margin-bottom: 8px; }
        .row-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .row-idx { font-size: 11px; color: #4a4d5a; font-weight: 600; }
        .row-remove {
            background: #7f1d1d; color: #fca5a5; border: none; border-radius: 4px;
            padding: 2px 8px; font-size: 11px; cursor: pointer;
        }
        .row-remove:hover { background: #991b1b; color: #fff; }
        .add-row {
            display: block; width: 100%; margin-top: 4px;
            background: #1f2937; border: 1px dashed #374151; color: #9ca3af;
            border-radius: 6px; padding: 6px; font-size: 12px; cursor: pointer;
        }
        .add-row:hover { background: #2a2d3a; color: #fff; }
        .panel .section.small > label { margin-top: 4px; }
        .panel .btn-delete {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            background: #7f1d1d;
            border: none;
            border-radius: 6px;
            color: #fca5a5;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
        }
        .panel .btn-delete:hover { background: #991b1b; color: #fff; }
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f1117; }
        ::-webkit-scrollbar-thumb { background: #2a2d3a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a3d4a; }
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #1a1d27; border: 1px solid #2a2d3a; padding: 10px 24px;
            border-radius: 8px; font-size: 14px; color: #e8edf5;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6); pointer-events: none;
            opacity: 0; transition: opacity 0.3s; z-index: 999; max-width: 80vw; word-break: break-all;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <!-- 工具栏 -->
    <div class="toolbar">
        <h1>地图编辑器 v02</h1>
        <button class="btn btn-success" onclick="newMap()">新建</button>
        <button class="btn btn-primary" onclick="exportJSON()">导出 map.json</button>
        <button class="btn" onclick="document.getElementById('fileInput').click()">导入 map.json</button>
        <input type="file" id="fileInput" accept=".json" onchange="importJSON(event)" />
        <button class="btn btn-outline" onclick="undo()">撤销</button>
        <button class="btn btn-outline" onclick="redo()">重做</button>
        <span class="spacer"></span>
        <button class="btn btn-outline" onclick="document.getElementById('metaInput').click()">加载 map-meta.json</button>
        <input type="file" id="metaInput" accept=".json" onchange="loadMapMeta(event)" />
        <button class="btn btn-outline" onclick="document.getElementById('behaviorInput').click()">行为文件 (文件夹)</button>
        <input type="file" id="behaviorInput" webkitdirectory onchange="loadBehaviors(event)" />
        <button class="btn btn-outline" onclick="document.getElementById('bgInput').click()">背景</button>
        <input type="file" id="bgInput" accept="image/*" onchange="loadBackground(event)" />
        <button class="btn btn-outline" onclick="removeBackground()">清除背景</button>
        <button class="btn btn-outline" id="gridToggle" onclick="toggleGrid()">网格</button>
        <button class="btn btn-outline" onclick="zoomOut()">−</button>
        <span class="zoom-indicator" id="zoomDisplay">100%</span>
        <button class="btn btn-outline" onclick="zoomIn()">+</button>
        <button class="btn btn-outline" onclick="resetZoom()">重置</button>
        <button class="btn btn-warning" id="modeToggle" onclick="toggleMode()">连线</button>
        <span class="mode-indicator" id="modeStatus">编辑</span>
        <span class="status" id="metaStatus">meta: 未加载</span>
        <span class="status" id="statusBar">就绪</span>
        <span class="status" id="cellCount">0 格</span>
    </div>

    <div class="main">
        <div class="canvas-container" id="canvasContainer">
            <div id="editorCanvas"></div>
        </div>
        <div class="panel" id="propertyPanel">
            <h2>属性</h2>
            <div class="empty">点击画布上的格子进行编辑</div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <!--
        ============================================================
        core-logic：纯函数核心（数据规范化 / 导出）
        该脚本块不依赖 DOM，Node 校验脚本可抽取并 eval 后直接调用
        normalizeCellForEditor / exportCellData 完成结构校验。
        ============================================================
    -->
    <script id="core-logic">
        const MAP_TYPE_LIST = ['empty', 'supply', 'monument', 'property', 'investment', 'jail', 'transport', 'event'];
        const INV_TRIGGER_EVENTS = [
            'any-player-lands-event',
            'any-player-lands-monument',
            'shareholder-bankrupt',
            'day-started',
            'night-started',
        ];
        // meta 未加载时的 UCT 字段回退（player: money/credit, region: pros）
        const DEFAULT_UCT_FIELDS = { player: ['money', 'credit'], region: ['pros'] };

        function num(v, d) { const n = Number(v); return Number.isFinite(n) ? n : d; }
        function str(v) { return (v === undefined || v === null) ? '' : String(v); }

        // 归一化 UCT：仅保留 player/region 两个作用域，值强制为 number
        function normalizeUct(uct) {
            const out = {};
            if (uct && typeof uct === 'object') {
                const p = uct.player;
                if (p && typeof p === 'object') { out.player = {}; for (const k of Object.keys(p)) out.player[k] = num(p[k], 0); }
                const r = uct.region;
                if (r && typeof r === 'object') { out.region = {}; for (const k of Object.keys(r)) out.region[k] = num(r[k], 0); }
            }
            return out;
        }

        // 导出清洗 UCT：剔除值为 0 的字段（缺省按 0 处理，故 0 可省）、剔除空作用域
        function cleanUct(uct) {
            const src = normalizeUct(uct);
            const out = {};
            for (const scope of ['player', 'region']) {
                const s = src[scope];
                if (s) {
                    const c = {};
                    for (const k of Object.keys(s)) if (s[k] !== 0) c[k] = s[k];
                    if (Object.keys(c).length) out[scope] = c;
                }
            }
            return out;
        }

        // i18n 对象：导入时容忍裸字符串；导出时固定 {zh-CN, en-US} 双键
        function i18nImport(v) {
            if (typeof v === 'string') return { 'zh-CN': v, 'en-US': '' };
            const o = (v && typeof v === 'object') ? v : {};
            return { 'zh-CN': str(o['zh-CN']), 'en-US': str(o['en-US']) };
        }
        function i18nExport(v) {
            const o = (v && typeof v === 'object') ? v : {};
            return { 'zh-CN': str(o['zh-CN']), 'en-US': str(o['en-US']) };
        }

        // UCT 数组（rent / upgradeCost）：保留用户添加的行（允许空 UCT 行），逐行清洗
        function uctArrayExport(arr) {
            if (!Array.isArray(arr)) return [];
            return arr.map(u => cleanUct(u));
        }

        // teleportDestinations：导出为 [{cellid, cost}]；完全空行（无 cellid 且 cost 为空）丢弃
        function teleportsExport(arr) {
            if (!Array.isArray(arr)) return [];
            const out = [];
            for (const t of arr) {
                const cost = cleanUct(t && t.cost);
                const hasCell = !(t === undefined || t === null || t.cellid === undefined || t.cellid === null || String(t.cellid).trim() === '');
                const hasContent = hasCell || Object.keys(cost).length > 0;
                if (!hasContent) continue;
                const n = Number(t.cellid);
                out.push({ cellid: Number.isFinite(n) ? n : 0, cost });
            }
            return out;
        }

        // investmentTriggers：导出为 [{id, on, delta}]；空行丢弃
        function triggersExport(arr) {
            if (!Array.isArray(arr)) return [];
            const out = [];
            for (const t of arr) {
                const id = str(t && t.id);
                const on = str(t && t.on);
                const delta = cleanUct(t && t.delta);
                if (!id && !on && Object.keys(delta).length === 0) continue;
                out.push({ id, on, delta });
            }
            return out;
        }

        // 导入归一化：任意来源的格子数据 -> 编辑器内部统一模型（含默认值）
        function normalizeCellForEditor(raw) {
            const r = raw && typeof raw === 'object' ? raw : {};
            const c = {};
            c.id = num(r.id, 0);
            c.x = num(r.x, 0);
            c.y = num(r.y, 0);
            c.type = MAP_TYPE_LIST.indexOf(r.type) >= 0 ? r.type : 'empty';
            c.name = i18nImport(r.name);
            c.description = i18nImport(r.description);
            c.destinations = Array.isArray(r.destinations) ? r.destinations.map(d => num(d, 0)) : [];
            c.theme = str(r.theme);
            c.regionId = str(r.regionId);
            c.timezone = num(r.timezone, 0);
            c.teleportDestinations = Array.isArray(r.teleportDestinations)
                ? r.teleportDestinations.map(t => ({
                    cellid: (t && (t.cellid === undefined || t.cellid === null || t.cellid === '')) ? '' : num(t && t.cellid, 0),
                    cost: normalizeUct(t && t.cost),
                }))
                : [];
            // 类型专属字段（统一归一化，未出现则给默认值）
            c.behaviorPass = str(r.behaviorPass);
            c.behaviorLand = str(r.behaviorLand);
            c.repairCost = normalizeUct(r.repairCost);
            c.price = normalizeUct(r.price);
            c.rent = Array.isArray(r.rent) ? r.rent.map(normalizeUct) : [];
            c.upgradeCost = Array.isArray(r.upgradeCost) ? r.upgradeCost.map(normalizeUct) : [];
            c.maxLevel = num(r.maxLevel, 0);
            c.maxOwnerCount = num(r.maxOwnerCount, 0);
            c.jailCooldown = num(r.jailCooldown, 0);
            c.jailCost = normalizeUct(r.jailCost);
            c.investmentTriggers = Array.isArray(r.investmentTriggers)
                ? r.investmentTriggers.map(t => ({ id: str(t && t.id), on: str(t && t.on), delta: normalizeUct(t && t.delta) }))
                : [];
            if (r.buyInMultiplier !== undefined) c.buyInMultiplier = num(r.buyInMultiplier, 0);
            return c;
        }

        // 导出：编辑器内部模型 -> 符合新地图格式的格子对象（结构对齐 packages/server/map.json）
        function exportCellData(cell) {
            const c = cell && typeof cell === 'object' ? cell : {};
            const out = {};
            out.id = num(c.id, 0);
            out.x = num(c.x, 0);
            out.y = num(c.y, 0);
            out.type = MAP_TYPE_LIST.indexOf(c.type) >= 0 ? c.type : 'empty';
            out.name = i18nExport(c.name);
            out.description = i18nExport(c.description);
            out.destinations = Array.isArray(c.destinations) ? c.destinations.map(d => num(d, 0)) : [];
            out.theme = str(c.theme);
            out.regionId = str(c.regionId);
            out.timezone = num(c.timezone, 0);
            switch (out.type) {
                case 'supply':
                    out.behaviorPass = str(c.behaviorPass);
                    out.behaviorLand = str(c.behaviorLand);
                    break;
                case 'event':
                    out.behaviorLand = str(c.behaviorLand);
                    break;
                case 'monument':
                    out.repairCost = cleanUct(c.repairCost);
                    break;
                case 'property':
                    out.price = cleanUct(c.price);
                    out.maxOwnerCount = num(c.maxOwnerCount, 0);
                    out.maxLevel = num(c.maxLevel, 0);
                    out.rent = uctArrayExport(c.rent);
                    out.upgradeCost = uctArrayExport(c.upgradeCost);
                    if (c.buyInMultiplier !== undefined) out.buyInMultiplier = num(c.buyInMultiplier, 0);
                    break;
                case 'investment':
                    out.price = cleanUct(c.price);
                    out.maxOwnerCount = num(c.maxOwnerCount, 0);
                    if (c.buyInMultiplier !== undefined) out.buyInMultiplier = num(c.buyInMultiplier, 0);
                    out.investmentTriggers = triggersExport(c.investmentTriggers);
                    break;
                case 'jail':
                    out.jailCooldown = num(c.jailCooldown, 0);
                    out.jailCost = cleanUct(c.jailCost);
                    break;
                // empty / transport：无额外专属字段（transport 使用公共 teleportDestinations）
                default:
                    break;
            }
            out.teleportDestinations = teleportsExport(c.teleportDestinations);
            return out;
        }
    </script>

    <script>
        // ================================================================
        //  1. 全局状态
        // ================================================================
        let cells = [];
        let selectedId = null;
        let isLineMode = false;
        let lineStartId = null;
        let showGrid = true;

        // meta 上下文：uct 字段全集 / 区域表 / 行为文件列表
        const metaState = {
            uct: { player: DEFAULT_UCT_FIELDS.player.slice(), region: DEFAULT_UCT_FIELDS.region.slice() },
            fieldLabels: { player: {}, region: {} },
            regions: [],
            behaviors: [],
            metaId: '',
            loaded: false,
        };

        const DEFAULT_TYPE = 'property';
        const TYPE_COLORS = {
            empty: '#6b7280',
            supply: '#10b981',
            monument: '#eab308',
            property: '#22c55e',
            investment: '#f43f5e',
            jail: '#7c3aed',
            transport: '#3b82f6',
            event: '#f59e0b',
        };
        const TYPE_LABELS = {
            empty: '空地',
            supply: '补给站',
            monument: '纪念碑',
            property: '地产',
            investment: '投资',
            jail: '监狱',
            transport: '交通枢纽',
            event: '事件',
        };
        const TYPE_HINTS = {
            empty: '空地格：无专属字段，可有描述，零效果。',
            supply: '必填 behaviorPass（经过行为）与 behaviorLand（落地行为）。',
            event: '必填 behaviorLand（落地行为）。',
            monument: 'repairCost 为 UCT，踩中可选修缮一次。',
            property: 'price / rent[] / upgradeCost[] 为 UCT，rent 与 upgradeCost 按等级索引。',
            investment: 'investmentTriggers[].on 只能选择预定义事件。',
            jail: 'jailCooldown 毫秒，jailCost 为 UCT。',
            transport: 'teleportDestinations 为停靠可选传送目标。',
        };

        const STORAGE_KEY = 'map_editor_v02_cells';
        const META_KEY = 'map_editor_v02_meta';

        // ================================================================
        //  2. Undo / Redo
        // ================================================================
        let history = [];
        let historyIndex = -1;
        const MAX_HISTORY = 100;

        function saveState() {
            history = history.slice(0, historyIndex + 1);
            history.push(JSON.stringify(cells));
            if (history.length > MAX_HISTORY) history.shift();
            historyIndex = history.length - 1;
        }

        function undo() {
            if (historyIndex <= 0) { setStatus('没有可撤销的操作'); return; }
            historyIndex--;
            restoreState(history[historyIndex]);
            setStatus('已撤销');
        }

        function redo() {
            if (historyIndex >= history.length - 1) { setStatus('没有可重做的操作'); return; }
            historyIndex++;
            restoreState(history[historyIndex]);
            setStatus('已重做');
        }

        function restoreState(json) {
            const data = JSON.parse(json);
            cells = data.map(c => normalizeCellForEditor(c));
            reindexCells(cells);
            selectedId = null;
            lineStartId = null;
            renderMain();
            showPanel(null);
            autoSave();
        }

        function commitAction() { saveState(); autoSave(); }

        // 删除/导入后重排 id（0 起连续），并重映射 destinations 与 teleport cellid
        function reindexCells(cellsArr) {
            const map = new Map();
            cellsArr.forEach((c, i) => map.set(c.id, i));
            cellsArr.forEach(c => {
                c.destinations = c.destinations
                    .map(d => map.has(d) ? map.get(d) : d)
                    .filter((d, i, a) => a.indexOf(d) === i);
                if (Array.isArray(c.teleportDestinations)) {
                    c.teleportDestinations.forEach(t => {
                        const raw = t.cellid;
                        if (raw === '' || raw === null || raw === undefined) return;
                        const n = Number(raw);
                        if (Number.isFinite(n) && map.has(n)) t.cellid = map.get(n);
                    });
                }
            });
            cellsArr.forEach((c, i) => c.id = i);
        }

        // ================================================================
        //  3. Konva 初始化
        // ================================================================
        const container = document.getElementById('editorCanvas');
        const stage = new Konva.Stage({
            container: 'editorCanvas',
            width: container.clientWidth,
            height: container.clientHeight,
            draggable: false,
        });
        const bgLayer = new Konva.Layer();
        const gridLayer = new Konva.Layer();
        const mainLayer = new Konva.Layer();
        stage.add(bgLayer);
        stage.add(gridLayer);
        stage.add(mainLayer);

        let bgImage = null;
        let currentScale = 1;
        let offsetX = 0, offsetY = 0;
        const MIN_SCALE = 0.1, MAX_SCALE = 5.0, SCALE_STEP = 0.1;

        function updateTransform() {
            stage.scale({ x: currentScale, y: currentScale });
            stage.position({ x: offsetX, y: offsetY });
            bgLayer.draw(); gridLayer.draw(); mainLayer.draw();
            updateZoomDisplay();
        }

        function updateZoomDisplay() {
            document.getElementById('zoomDisplay').textContent = Math.round(currentScale * 100) + '%';
        }

        function setScale(newScale) {
            currentScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
            updateTransform();
            drawGrid();
        }

        function zoomIn() { setScale(currentScale + SCALE_STEP); }
        function zoomOut() { setScale(currentScale - SCALE_STEP); }
        function resetZoom() { offsetX = 0; offsetY = 0; setScale(1); }

        stage.on('wheel', (e) => {
            e.evt.preventDefault();
            if (e.evt.ctrlKey || e.evt.metaKey) return;
            offsetX -= e.evt.deltaX || 0;
            offsetY -= e.evt.deltaY || 0;
            updateTransform();
        });

        document.addEventListener('keydown', (e) => {
            const isMod = e.ctrlKey || e.metaKey;
            if (isMod) {
                if (e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
                if ((e.key === 'Z' || e.key === 'z') && e.shiftKey) { e.preventDefault(); redo(); return; }
                if (e.key === '=' || e.key === '+') { e.preventDefault(); zoomIn(); return; }
                if (e.key === '-') { e.preventDefault(); zoomOut(); return; }
                if (e.key === '0') { e.preventDefault(); resetZoom(); return; }
            }
            if (e.key === 'Backspace') {
                const active = document.activeElement;
                if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) return;
                if (selectedId !== null) { e.preventDefault(); deleteCell(selectedId); }
            }
        });

        window.addEventListener('resize', () => {
            stage.width(container.clientWidth);
            stage.height(container.clientHeight);
            updateTransform();
            drawGrid();
            renderMain();
        });

        // 拖拽（全局单次注册）
        let dragState = null;
        window.addEventListener('mousemove', (e) => {
            if (!dragState) return;
            const cell = cells.find(c => c.id === dragState.cellId);
            if (!cell) return;
            const pos = stage.getRelativePointerPosition();
            if (!pos) return;
            cell.x = Math.max(30, Math.min(stage.width() / currentScale - 30, pos.x - dragState.offsetX));
            cell.y = Math.max(30, Math.min(stage.height() / currentScale - 30, pos.y - dragState.offsetY));
            renderMain();
        });
        window.addEventListener('mouseup', () => {
            if (dragState) { dragState = null; commitAction(); }
        });

        // ================================================================
        //  4. 网格
        // ================================================================
        function drawGrid() {
            gridLayer.destroyChildren();
            if (!showGrid) return;
            const step = 50;
            const color = '#2a2d3a';
            const w = stage.width() / currentScale;
            const h = stage.height() / currentScale;
            const startX = -offsetX / currentScale;
            const startY = -offsetY / currentScale;
            const endX = startX + w;
            const endY = startY + h;
            const x0 = Math.floor(startX / step) * step;
            const y0 = Math.floor(startY / step) * step;
            for (let x = x0; x <= endX; x += step) {
                gridLayer.add(new Konva.Line({ points: [x, startY, x, endY], stroke: color, strokeWidth: 0.5, listening: false }));
            }
            for (let y = y0; y <= endY; y += step) {
                gridLayer.add(new Konva.Line({ points: [startX, y, endX, y], stroke: color, strokeWidth: 0.5, listening: false }));
            }
            gridLayer.draw();
        }

        function toggleGrid() {
            showGrid = !showGrid;
            document.getElementById('gridToggle').style.borderColor = showGrid ? '#fbbf24' : '#3a3d4a';
            drawGrid();
        }
        toggleGrid();

        // ================================================================
        //  5. 背景
        // ================================================================
        function loadBackground(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    if (bgImage) bgImage.destroy();
                    bgImage = new Konva.Image({ image: img, x: 0, y: 0, width: img.width, height: img.height, listening: false });
                    bgLayer.add(bgImage);
                    bgLayer.draw();
                    setStatus('背景已导入');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function removeBackground() {
            if (bgImage) {
                bgImage.destroy();
                bgImage = null;
                bgLayer.draw();
                setStatus('背景已移除');
            }
        }

        // ================================================================
        //  6. map-meta.json 与行为文件加载
        // ================================================================
        function loadMapMeta(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    applyMapMeta(data);
                    setStatus('已加载 map-meta: ' + (data.id || '(无 id)'));
                } catch (err) {
                    setStatus('map-meta 加载失败: ' + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function applyMapMeta(data) {
            const d = data && typeof data === 'object' ? data : {};
            const uct = { player: [], region: [] };
            if (d.uct && typeof d.uct === 'object') {
                if (Array.isArray(d.uct.player)) uct.player = d.uct.player.slice();
                if (Array.isArray(d.uct.region)) uct.region = d.uct.region.slice();
            }
            // uct 未声明时从 valueFieldDefinitions 推导
            if (uct.player.length === 0 && uct.region.length === 0 && Array.isArray(d.valueFieldDefinitions)) {
                for (const def of d.valueFieldDefinitions) {
                    if (def && def.scope === 'player' && uct.player.indexOf(def.id) < 0) uct.player.push(def.id);
                    else if (def && def.scope === 'region' && uct.region.indexOf(def.id) < 0) uct.region.push(def.id);
                }
            }
            if (uct.player.length === 0) uct.player = DEFAULT_UCT_FIELDS.player.slice();
            if (uct.region.length === 0) uct.region = DEFAULT_UCT_FIELDS.region.slice();
            metaState.uct = uct;

            metaState.fieldLabels = { player: {}, region: {} };
            if (Array.isArray(d.valueFieldDefinitions)) {
                for (const def of d.valueFieldDefinitions) {
                    if (!def || !def.scope) continue;
                    const name = (def.name && (def.name['zh-CN'] || def.name['en-US'])) || def.id;
                    metaState.fieldLabels[def.scope][def.id] = name;
                }
            }
            metaState.regions = Array.isArray(d.regions) ? d.regions : [];
            metaState.metaId = d.id || '';
            metaState.loaded = true;
            saveMetaToLocal();
            updateMetaStatus();
            if (selectedId !== null) showPanel(currentCell());
        }

        function loadBehaviors(event) {
            const files = event.target.files;
            if (!files || !files.length) return;
            const ids = [];
            const tasks = [];
            for (const file of files) {
                if (!/\.json$/i.test(file.name)) continue;
                tasks.push(new Promise((resolve) => {
                    const reader = new FileReader();
                    const fallback = file.name.replace(/\.json$/i, '');
                    reader.onload = (re) => {
                        try {
                            const obj = JSON.parse(re.target.result);
                            ids.push((obj && typeof obj.id === 'string' && obj.id) ? obj.id : fallback);
                        } catch (err) {
                            ids.push(fallback);
                        }
                        resolve();
                    };
                    reader.onerror = () => { ids.push(fallback); resolve(); };
                    reader.readAsText(file);
                }));
            }
            Promise.all(tasks).then(() => {
                metaState.behaviors = Array.from(new Set(ids)).sort();
                saveMetaToLocal();
                updateMetaStatus();
                setStatus('已导入行为文件 ' + metaState.behaviors.length + ' 个');
                if (selectedId !== null) showPanel(currentCell());
            });
            event.target.value = '';
        }

        function updateMetaStatus() {
            const el = document.getElementById('metaStatus');
            if (metaState.loaded) {
                el.textContent = 'meta: ' + (metaState.metaId || '?') + ' · ' + metaState.regions.length + ' 区域 · ' + metaState.behaviors.length + ' 行为';
            } else {
                el.textContent = 'meta: 未加载（UCT 回退 money/credit/pros）';
            }
        }

        function saveMetaToLocal() {
            try {
                localStorage.setItem(META_KEY, JSON.stringify({
                    uct: metaState.uct,
                    fieldLabels: metaState.fieldLabels,
                    regions: metaState.regions,
                    behaviors: metaState.behaviors,
                    metaId: metaState.metaId,
                    loaded: metaState.loaded,
                }));
            } catch (e) { /* ignore */ }
        }

        function loadMetaFromLocal() {
            try {
                const raw = localStorage.getItem(META_KEY);
                if (!raw) return false;
                const m = JSON.parse(raw);
                if (m && m.uct) {
                    metaState.uct = m.uct;
                    metaState.fieldLabels = m.fieldLabels || { player: {}, region: {} };
                    metaState.regions = m.regions || [];
                    metaState.behaviors = m.behaviors || [];
                    metaState.metaId = m.metaId || '';
                    metaState.loaded = !!m.loaded;
                    return true;
                }
            } catch (e) { /* ignore */ }
            return false;
        }

        // ================================================================
        //  7. 工具函数
        // ================================================================
        function currentCell() { return cells.find(c => c.id === selectedId) || null; }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, (ch) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
            }[ch]));
        }
        function escapeAttr(s) { return escapeHtml(s); }

        // 按路径写入内部模型，如 "rent.0.player.money"
        function setPath(obj, path, value) {
            const segs = path.split('.');
            let cur = obj;
            for (let i = 0; i < segs.length - 1; i++) {
                const s = segs[i];
                const next = segs[i + 1];
                const nextIsIndex = /^\d+$/.test(next);
                if (cur[s] === undefined || cur[s] === null) {
                    cur[s] = nextIsIndex ? [] : {};
                }
                cur = cur[s];
            }
            cur[segs[segs.length - 1]] = value;
        }

        function fieldLabel(scope, fieldId) {
            const m = metaState.fieldLabels[scope];
            return (m && m[fieldId]) ? m[fieldId] : fieldId;
        }

        function createDefaultCell(id, x, y) {
            return {
                id, x, y,
                type: DEFAULT_TYPE,
                name: { 'zh-CN': '', 'en-US': '' },
                description: { 'zh-CN': '', 'en-US': '' },
                destinations: [],
                theme: '',
                regionId: metaState.regions.length ? metaState.regions[0].id : '',
                timezone: 0,
                teleportDestinations: [],
                behaviorPass: '',
                behaviorLand: '',
                repairCost: {},
                price: {},
                rent: [],
                upgradeCost: [],
                maxLevel: 0,
                maxOwnerCount: 0,
                jailCooldown: 0,
                jailCost: {},
                investmentTriggers: [],
            };
        }

        // ================================================================
        //  8. 主渲染
        // ================================================================
        function renderMain() {
            mainLayer.destroyChildren();

            cells.forEach(cell => {
                if (Array.isArray(cell.destinations)) {
                    cell.destinations.forEach(targetId => {
                        const target = cells.find(c => c.id === targetId);
                        if (!target) return;
                        mainLayer.add(new Konva.Line({
                            points: [cell.x, cell.y, target.x, target.y],
                            stroke: '#4a6fa5',
                            strokeWidth: 2,
                            dash: [8, 4],
                            opacity: 0.6,
                            listening: false,
                        }));
                    });
                }
            });

            cells.forEach(cell => {
                const type = cell.type || 'empty';
                const name = (cell.name && (cell.name['zh-CN'] || cell.name['en-US'])) || '未命名';
                const color = TYPE_COLORS[type] || '#888';
                const isSelected = (selectedId === cell.id);
                const isLineStart = (lineStartId === cell.id);

                mainLayer.add(new Konva.Rect({
                    x: cell.x - 30, y: cell.y - 30, width: 60, height: 60, radius: 8,
                    fill: '#1a1d27',
                    stroke: isSelected ? '#fbbf24' : (isLineStart ? '#f59e0b' : '#2a2d3a'),
                    strokeWidth: isSelected ? 3 : 2,
                    shadowColor: 'rgba(0,0,0,0.4)', shadowBlur: 8, shadowOffsetY: 2,
                }));

                mainLayer.add(new Konva.Rect({
                    x: cell.x - 30, y: cell.y - 20, width: 6, height: 40,
                    fill: color, cornerRadius: [0, 2, 2, 0], listening: false,
                }));

                mainLayer.add(new Konva.Text({
                    x: cell.x - 22, y: cell.y - 26, text: '#' + cell.id,
                    fontSize: 9, fill: '#4a4d5a', listening: false,
                }));

                mainLayer.add(new Konva.Text({
                    x: cell.x - 24, y: cell.y - 6, text: name,
                    fontSize: 11, fill: '#e8edf5', width: 48, align: 'center',
                    ellipsis: true, listening: false,
                }));

                const beh = cell.behaviorLand || cell.behaviorPass || '';
                const sub = beh ? TYPE_LABELS[type] + '·' + String(beh).split('/').pop() : TYPE_LABELS[type] || type;
                mainLayer.add(new Konva.Text({
                    x: cell.x - 20, y: cell.y + 16, text: sub,
                    fontSize: 7, fill: beh ? '#86efac' : '#6b7280', width: 40, align: 'center',
                    ellipsis: true, listening: false,
                }));

                if (isLineStart) {
                    mainLayer.add(new Konva.Circle({
                        x: cell.x, y: cell.y, radius: 34,
                        stroke: '#f59e0b', strokeWidth: 2, opacity: 0.5, dash: [4, 4], listening: false,
                    }));
                }

                const hitArea = new Konva.Rect({
                    x: cell.x - 30, y: cell.y - 30, width: 60, height: 60, fill: 'transparent',
                });
                hitArea.on('click', () => onCellClick(cell.id));
                hitArea.on('dblclick', () => onCellDblClick(cell.id));
                hitArea.on('mousedown', (e) => {
                    if (isLineMode) return;
                    const pos = stage.getRelativePointerPosition();
                    if (!pos) return;
                    dragState = { cellId: cell.id, offsetX: pos.x - cell.x, offsetY: pos.y - cell.y };
                    e.evt.stopPropagation();
                    e.cancelBubble = true;
                });
                mainLayer.add(hitArea);
            });

            mainLayer.draw();
            document.getElementById('cellCount').textContent = cells.length + ' 格';
        }

        function render() { drawGrid(); renderMain(); }

        // ================================================================
        //  9. 交互
        // ================================================================
        function onCellClick(id) {
            if (isLineMode) {
                if (lineStartId === null) {
                    lineStartId = id;
                    setStatus('连线起点 #' + id + '，请点击目标格');
                    renderMain();
                    return;
                }
                if (lineStartId === id) {
                    lineStartId = null;
                    setStatus('已取消连线');
                    renderMain();
                    return;
                }
                const a = cells.find(c => c.id === lineStartId);
                const b = cells.find(c => c.id === id);
                if (!a || !b) { lineStartId = null; renderMain(); return; }
                if (!a.destinations.includes(id)) a.destinations.push(id);
                if (!b.destinations.includes(lineStartId)) b.destinations.push(lineStartId);
                setStatus('已连接 #' + lineStartId + ' ↔ #' + id);
                lineStartId = null;
                renderMain();
                commitAction();
                return;
            }
            selectedId = id;
            renderMain();
            showPanel(cells.find(c => c.id === id));
        }

        function onCellDblClick(id) {
            selectedId = id;
            renderMain();
            showPanel(cells.find(c => c.id === id), true);
        }

        stage.on('click', (e) => {
            if (e.target !== stage) return;
            if (isLineMode) {
                if (lineStartId !== null) {
                    lineStartId = null;
                    setStatus('已取消连线');
                    renderMain();
                }
                return;
            }
            const pos = stage.getRelativePointerPosition();
            if (!pos) return;
            const id = cells.length ? Math.max(...cells.map(c => c.id)) + 1 : 0;
            const newCell = createDefaultCell(id, pos.x, pos.y);
            cells.push(newCell);
            selectedId = id;
            renderMain();
            showPanel(newCell);
            setStatus('创建格子 #' + id + '（' + TYPE_LABELS[newCell.type] + '）');
            commitAction();
        });

        // ================================================================
        //  10. 属性面板渲染
        // ================================================================
        function uctEditorHtml(uct, path) {
            const u = uct && typeof uct === 'object' ? uct : {};
            let html = '<div class="uct-editor">';
            for (const scope of ['player', 'region']) {
                const scopeLabel = scope === 'player' ? '玩家 player' : '区域 region';
                const fields = metaState.uct[scope] || [];
                html += '<div class="uct-group"><div class="uct-group-title">' + scopeLabel + '</div>';
                if (!fields.length) {
                    html += '<div class="uct-empty">（' + scope + ' 无字段）</div>';
                } else {
                    for (const f of fields) {
                        const sub = u[scope] || {};
                        const v = sub[f] !== undefined ? sub[f] : 0;
                        html += '<div class="uct-field"><label title="' + scope + '.' + f + '">' + escapeHtml(fieldLabel(scope, f)) + '</label>';
                        html += '<input type="number" class="num" data-path="' + path + '.' + scope + '.' + f + '" value="' + v + '"></div>';
                    }
                }
                html += '</div>';
            }
            html += '</div>';
            return html;
        }

        function uctArrayEditorHtml(key, label) {
            const cell = currentCell();
            const arr = Array.isArray(cell[key]) ? cell[key] : [];
            let html = '<div class="section"><label>' + label + '</label><div class="array-editor" id="arr_' + key + '">';
            arr.forEach((item, idx) => {
                html += '<div class="array-row">';
                html += '<div class="row-head"><span class="row-idx">' + key + '[' + idx + ']</span>';
                html += '<button class="row-remove" data-action="remove" data-key="' + key + '" data-index="' + idx + '">移除</button></div>';
                html += uctEditorHtml(item, key + '.' + idx);
                html += '</div>';
            });
            html += '<button class="add-row" data-action="add-uct" data-key="' + key + '">+ 添加元素</button>';
            html += '</div></div>';
            return html;
        }

        function behaviorSelectHtml(value, path) {
            let html = '<select data-path="' + path + '">';
            if (!metaState.behaviors.length) {
                html += '<option value="">（未导入行为文件，请先导入）</option>';
            } else {
                html += '<option value="">— 选择行为 —</option>';
                for (const b of metaState.behaviors) {
                    html += '<option value="' + escapeAttr(b) + '"' + (b === value ? ' selected' : '') + '>' + escapeHtml(b) + '</option>';
                }
            }
            html += '</select>';
            return html;
        }

        function regionSelectHtml(value) {
            if (!metaState.regions.length) {
                return '<input data-path="regionId" value="' + escapeAttr(value) + '" placeholder="未加载 map-meta，请手动填写区域 id">';
            }
            let html = '<select data-path="regionId">';
            html += '<option value="">— 选择区域 —</option>';
            for (const r of metaState.regions) {
                const label = (r.name && r.name['zh-CN']) ? r.name['zh-CN'] + ' (' + r.id + ')' : r.id;
                html += '<option value="' + escapeAttr(r.id) + '"' + (r.id === value ? ' selected' : '') + '>' + escapeHtml(label) + '</option>';
            }
            html += '</select>';
            return html;
        }

        function buyInMultiplierHtml(cell) {
            const enabled = cell.buyInMultiplier !== undefined;
            let html = '<div class="section"><label>合租买入乘数 buyInMultiplier（可选）</label>';
            html += '<div class="bim">';
            html += '<label class="toggle"><input type="checkbox" data-action="toggle-bim"' + (enabled ? ' checked' : '') + '> 启用</label>';
            html += enabled ? '<input type="number" class="num" data-path="buyInMultiplier" step="any" value="' + num(cell.buyInMultiplier, 0) + '">' : '';
            html += '</div></div>';
            return html;
        }

        function teleportsEditorHtml() {
            const cell = currentCell();
            const arr = Array.isArray(cell.teleportDestinations) ? cell.teleportDestinations : [];
            let html = '<div class="section"><label>传送目标 teleportDestinations <span class="hint">所有类型通用，默认 []</span></label><div class="array-editor" id="arr_teleportDestinations">';
            arr.forEach((item, idx) => {
                const cellidVal = (item.cellid === undefined || item.cellid === null) ? '' : item.cellid;
                html += '<div class="array-row">';
                html += '<div class="row-head"><span class="row-idx">teleport[' + idx + ']</span>';
                html += '<button class="row-remove" data-action="remove" data-key="teleportDestinations" data-index="' + idx + '">移除</button></div>';
                html += '<div class="section small"><label>目标格 cellid</label><input type="number" class="cellid-input" data-path="teleportDestinations.' + idx + '.cellid" value="' + escapeAttr(cellidVal) + '"></div>';
                html += '<div class="section small"><label>费用 cost</label>' + uctEditorHtml(item.cost, 'teleportDestinations.' + idx + '.cost') + '</div>';
                html += '</div>';
            });
            html += '<button class="add-row" data-action="add-teleport">+ 添加传送目标</button>';
            html += '</div></div>';
            return html;
        }

        function triggersEditorHtml() {
            const cell = currentCell();
            const arr = Array.isArray(cell.investmentTriggers) ? cell.investmentTriggers : [];
            let html = '<div class="section"><label>投资触发 investmentTriggers[]</label><div class="array-editor" id="arr_investmentTriggers">';
            arr.forEach((item, idx) => {
                html += '<div class="array-row">';
                html += '<div class="row-head"><span class="row-idx">trigger[' + idx + ']</span>';
                html += '<button class="row-remove" data-action="remove" data-key="investmentTriggers" data-index="' + idx + '">移除</button></div>';
                html += '<div class="section small"><label>id</label><input data-path="investmentTriggers.' + idx + '.id" value="' + escapeAttr(item.id) + '"></div>';
                html += '<div class="section small"><label>on（预定义事件）</label><select data-path="investmentTriggers.' + idx + '.on">';
                for (const ev of INV_TRIGGER_EVENTS) {
                    html += '<option value="' + ev + '"' + (ev === item.on ? ' selected' : '') + '>' + ev + '</option>';
                }
                html += '</select></div>';
                html += '<div class="section small"><label>delta</label>' + uctEditorHtml(item.delta, 'investmentTriggers.' + idx + '.delta') + '</div>';
                html += '</div>';
            });
            html += '<button class="add-row" data-action="add-trigger">+ 添加触发</button>';
            html += '</div></div>';
            return html;
        }

        function showPanel(cell, focusName) {
            const panel = document.getElementById('propertyPanel');
            if (!cell) {
                panel.innerHTML = '<h2>属性</h2><div class="empty">点击画布上的格子进行编辑</div>';
                return;
            }
            const t = cell.type;
            let html = '<h2>属性 · #' + cell.id + '</h2>';
            html += '<div class="cell-brief">坐标 (' + Math.round(cell.x) + ', ' + Math.round(cell.y) + ') · 连线 [' +
                cell.destinations.join(', ') + ']<br>id / 坐标 / 连线由编辑器自动管理，导出时自动连续编号。</div>';

            html += '<div class="section"><label>类型 type</label><select data-path="type" class="type-select">';
            for (const ty of MAP_TYPE_LIST) {
                html += '<option value="' + ty + '"' + (ty === t ? ' selected' : '') + '>' + (TYPE_LABELS[ty] || ty) + ' (' + ty + ')</option>';
            }
            html += '</select><div class="type-hint">' + (TYPE_HINTS[t] || '') + '</div></div>';

            html += '<div class="section"><label>名称 name · 中文 (zh-CN)</label><input data-path="name.zh-CN" id="name_zh" value="' + escapeAttr(cell.name['zh-CN']) + '"></div>';
            html += '<div class="section"><label>名称 name · 英文 (en-US，可留空)</label><input data-path="name.en-US" value="' + escapeAttr(cell.name['en-US']) + '"></div>';
            html += '<div class="section"><label>描述 description · 中文</label><textarea data-path="description.zh-CN" rows="2">' + escapeHtml(cell.description['zh-CN']) + '</textarea></div>';
            html += '<div class="section"><label>描述 description · 英文（可留空）</label><textarea data-path="description.en-US" rows="2">' + escapeHtml(cell.description['en-US']) + '</textarea></div>';

            html += '<div class="section-row">';
            html += '<div class="section"><label>主题 theme</label><input data-path="theme" value="' + escapeAttr(cell.theme) + '"></div>';
            html += '<div class="section"><label>区域 regionId</label>' + regionSelectHtml(cell.regionId) + '</div>';
            html += '</div>';
            html += '<div class="section"><label>时区 timezone（UTC 偏移分钟，如 480=UTC+8）</label><input type="number" class="num" data-path="timezone" value="' + num(cell.timezone, 0) + '"></div>';

            // 类型专属字段
            if (t === 'supply') {
                html += '<div class="section"><label>经过行为 behaviorPass</label>' + behaviorSelectHtml(cell.behaviorPass, 'behaviorPass') + '</div>';
                html += '<div class="section"><label>落地行为 behaviorLand</label>' + behaviorSelectHtml(cell.behaviorLand, 'behaviorLand') + '</div>';
            } else if (t === 'event') {
                html += '<div class="section"><label>落地行为 behaviorLand</label>' + behaviorSelectHtml(cell.behaviorLand, 'behaviorLand') + '</div>';
            } else if (t === 'monument') {
                html += '<div class="section"><label>修缮费用 repairCost（UCT）</label>' + uctEditorHtml(cell.repairCost, 'repairCost') + '</div>';
            } else if (t === 'property') {
                html += '<div class="section"><label>购入价 price（UCT）</label>' + uctEditorHtml(cell.price, 'price') + '</div>';
                html += uctArrayEditorHtml('rent', '租金 rent[]（UCT 数组，按等级索引）');
                html += uctArrayEditorHtml('upgradeCost', '升级费用 upgradeCost[]（UCT 数组）');
                html += '<div class="section-row">';
                html += '<div class="section"><label>最大等级 maxLevel</label><input type="number" class="num" data-path="maxLevel" value="' + num(cell.maxLevel, 0) + '"></div>';
                html += '<div class="section"><label>最大股东数 maxOwnerCount</label><input type="number" class="num" data-path="maxOwnerCount" value="' + num(cell.maxOwnerCount, 0) + '"></div>';
                html += '</div>';
                html += buyInMultiplierHtml(cell);
            } else if (t === 'investment') {
                html += '<div class="section"><label>购入价 price（UCT）</label>' + uctEditorHtml(cell.price, 'price') + '</div>';
                html += '<div class="section"><label>最大股东数 maxOwnerCount</label><input type="number" class="num" data-path="maxOwnerCount" value="' + num(cell.maxOwnerCount, 0) + '"></div>';
                html += buyInMultiplierHtml(cell);
                html += triggersEditorHtml();
            } else if (t === 'jail') {
                html += '<div class="section"><label>入狱冷却 jailCooldown（毫秒）</label><input type="number" class="num" data-path="jailCooldown" value="' + num(cell.jailCooldown, 0) + '"></div>';
                html += '<div class="section"><label>入狱费用 jailCost（UCT）</label>' + uctEditorHtml(cell.jailCost, 'jailCost') + '</div>';
            }
            // transport：无额外专属字段，依靠公共 teleportDestinations

            html += teleportsEditorHtml();
            html += '<button class="btn-delete" data-action="delete">删除此格</button>';
            panel.innerHTML = html;

            if (focusName) {
                const el = document.getElementById('name_zh');
                if (el) { el.focus(); el.select(); }
            }
        }

        // ================================================================
        //  11. 面板事件（事件委托，支持动态行）
        // ================================================================
        function updateFromInput(el) {
            const cell = currentCell();
            if (!cell) return;
            const path = el.dataset.path;
            let val;
            if (el.type === 'number' || el.classList.contains('num')) {
                const n = parseFloat(el.value);
                val = Number.isNaN(n) ? 0 : n;
            } else {
                val = el.value;
            }
            setPath(cell, path, val);
        }

        function addUctRow(key) {
            const cell = currentCell();
            if (!cell) return;
            if (!Array.isArray(cell[key])) cell[key] = [];
            cell[key].push({});
            commitAction();
            showPanel(cell);
        }

        function addTeleportRow() {
            const cell = currentCell();
            if (!cell) return;
            cell.teleportDestinations.push({ cellid: '', cost: {} });
            commitAction();
            showPanel(cell);
        }

        function addTriggerRow() {
            const cell = currentCell();
            if (!cell) return;
            cell.investmentTriggers.push({ id: '', on: INV_TRIGGER_EVENTS[0], delta: {} });
            commitAction();
            showPanel(cell);
        }

        function removeRow(key, idx) {
            const cell = currentCell();
            if (!cell) return;
            if (!Array.isArray(cell[key])) return;
            cell[key].splice(idx, 1);
            commitAction();
            showPanel(cell);
        }

        function toggleBim() {
            const cell = currentCell();
            if (!cell) return;
            if (cell.buyInMultiplier === undefined) {
                cell.buyInMultiplier = 1;
            } else {
                delete cell.buyInMultiplier;
            }
            commitAction();
            showPanel(cell);
        }

        (function bindPanelEvents() {
            const panel = document.getElementById('propertyPanel');
            panel.addEventListener('input', (e) => {
                const el = e.target;
                if (el && el.dataset && el.dataset.path) updateFromInput(el);
            });
            panel.addEventListener('change', (e) => {
                const el = e.target;
                if (!el || !el.dataset) return;
                if (el.dataset.path) {
                    updateFromInput(el);
                    commitAction();
                    if (el.dataset.path === 'type') showPanel(currentCell());
                } else if (el.dataset.action === 'toggle-bim') {
                    toggleBim();
                }
            });
            panel.addEventListener('click', (e) => {
                const el = e.target && e.target.closest ? e.target.closest('[data-action]') : null;
                if (!el) return;
                const action = el.dataset.action;
                if (action === 'toggle-bim') return; // 由 change 事件处理，避免重复触发
                if (action === 'remove') removeRow(el.dataset.key, parseInt(el.dataset.index, 10));
                else if (action === 'add-uct') addUctRow(el.dataset.key);
                else if (action === 'add-teleport') addTeleportRow();
                else if (action === 'add-trigger') addTriggerRow();
                else if (action === 'delete') deleteCell(selectedId);
            });
        })();

        // ================================================================
        //  12. 删除格子
        // ================================================================
        function deleteCell(id) {
            const cell = cells.find(c => c.id === id);
            if (!cell) { setStatus('格子不存在'); return; }
            if (!confirm('确定删除 #' + id + ' 吗？')) return;
            cells.forEach(c => {
                c.destinations = c.destinations.filter(d => d !== id);
                if (Array.isArray(c.teleportDestinations)) {
                    c.teleportDestinations = c.teleportDestinations.filter(t => t.cellid !== id);
                }
            });
            cells = cells.filter(c => c.id !== id);
            reindexCells(cells);
            selectedId = null;
            lineStartId = null;
            renderMain();
            showPanel(null);
            setStatus('已删除 #' + id);
            commitAction();
        }

        // ================================================================
        //  13. 模式切换
        // ================================================================
        function toggleMode() {
            isLineMode = !isLineMode;
            document.getElementById('modeToggle').textContent = isLineMode ? '编辑' : '连线';
            document.getElementById('modeStatus').textContent = isLineMode ? '连线' : '编辑';
            lineStartId = null;
            setStatus(isLineMode ? '连线模式' : '编辑模式');
            renderMain();
        }

        // ================================================================
        //  14. 导出 / 导入 / 新建
        // ================================================================
        async function exportJSON() {
            if (!cells.length) { setStatus('地图为空'); return; }
            const data = JSON.stringify(cells.map(c => exportCellData(c)), null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            if ('showSaveFilePicker' in window) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: 'map.json',
                        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
                    });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    setStatus('导出成功（已选择位置）');
                    return;
                } catch (err) {
                    if (err.name !== 'AbortError') console.warn(err);
                }
            }
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'map.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            setStatus('导出成功');
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!Array.isArray(data)) throw new Error('无效地图文件：应为格子数组');
                    cells = data.map(item => normalizeCellForEditor(item));
                    reindexCells(cells);
                    selectedId = null;
                    lineStartId = null;
                    renderMain();
                    showPanel(null);
                    setStatus('导入成功，' + cells.length + ' 格');
                    commitAction();
                } catch (err) {
                    setStatus('导入失败: ' + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function newMap() {
            if (cells.length > 0 && !confirm('确定新建？当前数据将丢失。')) return;
            cells = [];
            selectedId = null;
            lineStartId = null;
            isLineMode = false;
            document.getElementById('modeToggle').textContent = '连线';
            document.getElementById('modeStatus').textContent = '编辑';
            renderMain();
            showPanel(null);
            setStatus('已清空');
            commitAction();
        }

        // ================================================================
        //  15. 持久化
        // ================================================================
        function saveToLocal() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cells)); } catch (e) { /* ignore */ }
        }

        function loadFromLocal() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    cells = data.map(c => normalizeCellForEditor(c));
                    reindexCells(cells);
                    return true;
                }
            } catch (e) { console.warn('加载本地数据失败', e); }
            return false;
        }

        let autoSaveTimer = null;
        function autoSave() {
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(saveToLocal, 500);
        }

        // ================================================================
        //  16. UI 辅助
        // ================================================================
        function setStatus(msg) {
            document.getElementById('statusBar').textContent = msg;
            showToast(msg);
        }
        let toastTimer = null;
        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
        }

        // ================================================================
        //  17. 初始化
        // ================================================================
        function init() {
            const metaLoaded = loadMetaFromLocal();
            updateMetaStatus();
            const loaded = loadFromLocal();
            if (!loaded || cells.length === 0) {
                cells = [];
                setStatus('新地图');
            } else {
                setStatus('已加载，' + cells.length + ' 格');
            }
            saveState();
            resetZoom();
            render();
            showPanel(null);
            // 暴露全局
            window.newMap = newMap;
            window.exportJSON = exportJSON;
            window.importJSON = importJSON;
            window.loadMapMeta = loadMapMeta;
            window.loadBehaviors = loadBehaviors;
            window.deleteCell = deleteCell;
            window.toggleMode = toggleMode;
            window.zoomIn = zoomIn;
            window.zoomOut = zoomOut;
            window.resetZoom = resetZoom;
            window.loadBackground = loadBackground;
            window.removeBackground = removeBackground;
            window.toggleGrid = toggleGrid;
            window.undo = undo;
            window.redo = redo;
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    </script>
</body>
</html>
